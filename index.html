<!-- Iframe 1: Auto-run forecast header -->
<!-- Heights below are just sane starting values — each iframe reports its
     real content height on load and resizes itself via the script below. -->
<iframe src="https://glasgow46239.github.io/britainpredicts/iframe1_forecast_header.html"
  id="forecast-iframe" width="100%" height="640px" frameborder="0" scrolling="no"></iframe><iframe src="https://glasgow46239.github.io/britainpredicts/iframe2_calculator.html" id="calculator-iframe" width="100%" height="900px" frameborder="0" scrolling="no"></iframe><iframe src="https://glasgow46239.github.io/britainpredicts/iframe3_map.html" id="map-iframe" width="100%" frameborder="0" scrolling="no"></iframe>

<!-- Communication script — handles scroll + forecast relay -->
<script>
window.addEventListener('message', function(e) {
  if (e.data && e.data.action === 'scrollToCalculator') {
    document.getElementById('calculator-iframe').scrollIntoView({ behavior: 'smooth' });
  }
  if (e.data && e.data.action === 'scrollToMap') {
    document.getElementById('map-iframe').scrollIntoView({ behavior: 'smooth' });
  }
  if (e.data && e.data.action === 'forecastUpdate') {
    var mapFrame = document.getElementById('map-iframe');
    if (mapFrame) mapFrame.contentWindow.postMessage(e.data, '*');
  }
  if (e.data && e.data.action === 'exportCSV') {
    var mapFrameForExport = document.getElementById('map-iframe');
    if (mapFrameForExport) mapFrameForExport.contentWindow.postMessage(e.data, '*');
  }
  if (e.data && e.data.action === 'seatCounts') {
    var forecastFrame = document.getElementById('forecast-iframe');
    if (forecastFrame) forecastFrame.contentWindow.postMessage(e.data, '*');
    var calcFrame = document.getElementById('calculator-iframe');
    if (calcFrame) calcFrame.contentWindow.postMessage(e.data, '*');
  }
  if (e.data && e.data.action === 'resize' && e.data.frame) {
    var idByFrame = { forecast: 'forecast-iframe', calculator: 'calculator-iframe', map: 'map-iframe' };
    var elId = idByFrame[e.data.frame];
    var el = elId && document.getElementById(elId);
    if (el && e.data.height) el.style.height = Math.ceil(e.data.height) + 'px';
  }
});
</script>
