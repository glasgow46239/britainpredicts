<!-- Iframe 2: Calculator -->

  id="calculator-iframe" width="100%" height="620" frameborder="0" scrolling="no"></iframe>

<!-- Iframe 3: Map + list -->
<iframe src="https://glasgow46239.github.io/britainpredicts/iframe3_map.html"
  width="100%" height="600" frameborder="0" scrolling="no"></iframe>

<script>
window.addEventListener('message', function(e) {
  // Scroll to calculator
  if (e.data && e.data.action === 'scrollToCalculator') {
    document.getElementById('calculator-iframe').scrollIntoView({ behavior: 'smooth' });
  }
  // Relay forecast updates from iframe 2 to iframe 3
  if (e.data && e.data.action === 'forecastUpdate') {
    var mapFrame = document.getElementById('map-iframe');
    if (mapFrame) mapFrame.contentWindow.postMessage(e.data, '*');
  }
});
</script>
