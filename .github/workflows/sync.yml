name: Sync data from Sheets
on:
  schedule:
    - cron: '0 6 * * *'  # 6am daily
  workflow_dispatch:       # also triggerable manually

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - name: Fetch polling data
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=0&single=true&output=csv" -o polling.csv
      - name: Fetch results data  
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=888442617&single=true&output=csv" -o results_2024.csv
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.csv
          git diff --staged --quiet || git commit -m "Data sync $(date +%Y-%m-%d)"
          git push
