<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Britain Predicts — Calculator</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Arial',sans-serif; background:#fff; font-size:13px; }

#loading { padding:24px; color:#999; text-align:center; }
#error   { padding:24px; color:#c00; font-size:12px; }
#wrap    { display:none; }

#header { padding:10px 16px 8px; border-bottom:2px solid #111; }
#header h2 { font-size:13px; font-weight:700; color:#111; }
#header p  { font-size:10px; color:#888; margin-top:2px; }

/* ── Tab bar ── */
#tabs { display:flex; border-bottom:1px solid #ddd; padding:0 16px; margin-top:8px; }
.tab {
  padding:7px 14px 6px; font-size:11px; font-weight:700; color:#999;
  border-bottom:2px solid transparent; cursor:pointer; margin-bottom:-1px;
}
.tab.active { color:#111; border-bottom-color:#111; }

/* ── Panels ── */
.panel { display:none; padding:12px 16px 8px; }
.panel.active { display:block; }

/* ── GB-wide inputs ── */
#gb-grid {
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:6px; margin-bottom:10px;
}
@media(min-width:500px){ #gb-grid { grid-template-columns:repeat(8,1fr); } }

.inp-col { display:flex; flex-direction:column; align-items:center; gap:3px; }
.inp-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.inp-field {
  width:100%; border:1.5px solid #ddd; border-radius:3px;
  text-align:center; font-size:13px; font-weight:700;
  padding:5px 2px; outline:none;
}
.inp-field:focus { border-color:#111; }

/* ── Regional inputs ── */
.region-block { margin-bottom:12px; }
.region-name  { font-size:10px; font-weight:700; color:#666; text-transform:uppercase;
                letter-spacing:.05em; margin-bottom:6px; }
.region-grid  {
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:4px;
}
@media(min-width:500px){ .region-grid { grid-template-columns:repeat(8,1fr); } }

/* ── Total + controls ── */
#controls { display:flex; align-items:center; gap:8px; padding:4px 0 10px; flex-wrap:wrap; }
.total-label { font-size:11px; color:#888; }
.total-val   { font-size:11px; font-weight:700; }
.spacer      { flex:1; }
.ctrl-btn {
  padding:5px 10px; border:1px solid #ddd; border-radius:3px;
  font-size:10px; font-weight:700; cursor:pointer; background:#fff; color:#555;
}
.ctrl-btn:hover { background:#f5f5f5; }

/* ── Run button ── */
#run-wrap { padding:0 16px 10px; }
#run-btn {
  width:100%; padding:10px; background:#111; color:#fff;
  border:none; border-radius:4px; font-size:13px; font-weight:700;
  cursor:pointer; letter-spacing:.02em;
}
#run-btn:hover { background:#333; }

/* ── Results ── */
#results-wrap { padding:0 16px 12px; display:none; }
#results-label { font-size:10px; font-weight:700; color:#666; text-transform:uppercase;
                 letter-spacing:.05em; margin-bottom:8px; }
#results-grid {
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:6px;
}
@media(min-width:500px){ #results-grid { grid-template-columns:repeat(8,1fr); } }

.r-col    { display:flex; flex-direction:column; align-items:center; gap:3px; }
.r-party  { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.r-seats  { font-size:22px; font-weight:700; line-height:1; }
.r-change { font-size:10px; }
.r-bar-bg { width:100%; height:3px; background:#eee; border-radius:2px; }
.r-bar    { height:100%; border-radius:2px; }

#status { font-size:9px; color:#ccc; text-align:right; padding:2px 16px 8px; }
</style>
</head>
<body>

<div id="loading">Loading…</div>
<div id="error" style="display:none"></div>

<div id="wrap">
  <div id="header">
    <h2>Britain Predicts — Create Your Forecast</h2>
    <p>Set national or regional poll shares, then run</p>
  </div>

  <div id="tabs">
    <div class="tab active" onclick="showTab('gb')">GB-wide</div>
    <div class="tab" onclick="showTab('regional')">By region</div>
  </div>

  <div id="panel-gb" class="panel active">
    <div id="gb-grid"></div>
    <div id="controls-gb" class="controls"></div>
  </div>

  <div id="panel-regional" class="panel">
    <div id="regional-panels"></div>
  </div>

  <div id="run-wrap">
    <button id="run-btn" onclick="runForecast()">Run forecast ›</button>
  </div>

  <div id="results-wrap">
    <div id="results-label">Projected seats</div>
    <div id="results-grid"></div>
  </div>

  <div id="status"></div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const POLL_CSV    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=0&single=true&output=csv";
const RESULTS_URL = "https://raw.githubusercontent.com/glasgow46239/britainpredicts/main/results_2024.csv";
const PARAMS_CSV  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=1932049493&single=true&output=csv";

const PARTIES    = ['con','lab','ldem','grn','snp','pc','ref','oth'];
const REGIONS    = ['Scotland','Wales','Northern England','Southern England','Midlands','London'];
const TILE_ORDER = ['lab','ref','con','ldem','grn','snp','pc','oth'];
const LABELS     = {con:'Con',lab:'Lab',ldem:'LDem',grn:'Grn',snp:'SNP',pc:'PC',ref:'Reform',oth:'Other'};
const COLOURS    = {con:'#0087DC',lab:'#E4003B',ldem:'#FAA61A',grn:'#02A95B',snp:'#C8A400',pc:'#3F8428',ref:'#12B6CF',oth:'#57534e'};
const SEATS_2024 = {con:121,lab:412,ldem:72,grn:4,snp:9,pc:4,ref:5,oth:5};
const GB_2024    = {con:23.7,lab:33.7,ldem:12.2,grn:6.4,snp:2.5,pc:0.7,ref:14.3,oth:6.2};

// ── Regional 2024 results — used as swing baseline ───────────────────────────
const BASELINE_2024 = {
  'GB-wide':         {con:23.7,lab:33.7,ldem:12.2,grn:6.4, snp:2.5, pc:0.7, ref:14.3,oth:6.2},
  'Scotland':        {con:12.7,lab:35.3,ldem:9.7, grn:3.8, snp:30.0,pc:0,   ref:7.0, oth:1.5},
  'Wales':           {con:18.2,lab:37.0,ldem:6.5, grn:4.7, snp:0,   pc:14.8,ref:16.9,oth:1.9},
  'Northern England':{con:19.6,lab:43.6,ldem:6.9, grn:7.2, snp:0,   pc:0,   ref:17.4,oth:5.3},
  'Southern England':{con:29.7,lab:26.5,ldem:19.4,grn:7.1, snp:0,   pc:0,   ref:15.1,oth:2.1},
  'Midlands':        {con:27.7,lab:35.2,ldem:7.3, grn:6.4, snp:0,   pc:0,   ref:18.6,oth:4.8},
  'London':          {con:20.6,lab:43.0,ldem:11.0,grn:10.0,snp:0,   pc:0,   ref:8.7, oth:6.7},
};

// State
let resultRows = [], params = {}, livePollMap = {};

// ── CSV parser ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (!lines.length) return [];
  const sep = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(sep).map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(sep).map(v => v.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = vals[i] !== undefined ? vals[i] : '');
    return obj;
  });
}

async function fetchCSV(url) {
  const sep = url.includes('?') ? '&' : '?';
  const r = await fetch(url + sep + '_=' + Date.now());
  if (!r.ok) throw new Error('Fetch failed ' + r.status);
  return parseCSV(await r.text());
}

function buildPollMap(rows) {
  const map = {};
  for (const row of rows) {
    const region = (row['region'] || row['Region'] || Object.values(row)[0] || '').trim();
    if (!region) continue;
    map[region] = {
      con:  parseFloat(row['con_pct']  || 0) || 0,
      lab:  parseFloat(row['lab_pct']  || 0) || 0,
      ldem: parseFloat(row['ldem_pct'] || 0) || 0,
      grn:  parseFloat(row['grn_pct']  || 0) || 0,
      snp:  parseFloat(row['snp_pct']  || 0) || 0,
      pc:   parseFloat(row['pc_pct']   || 0) || 0,
      ref:  parseFloat(row['ref_pct']  || 0) || 0,
      oth:  (parseFloat(row['oth_pct'] || 0) || 0) + (parseFloat(row['rstr_pct'] || 0) || 0),
    };
  }
  return map;
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const names = ['gb','regional'];
    t.classList.toggle('active', names[i] === tab);
  });
  document.getElementById('panel-gb').classList.toggle('active', tab === 'gb');
  document.getElementById('panel-regional').classList.toggle('active', tab === 'regional');
}

// ── Build GB-wide input row ───────────────────────────────────────────────────
function buildGBInputs(gbPoll) {
  const grid = document.getElementById('gb-grid');
  grid.innerHTML = '';
  for (const p of PARTIES) {
    const val = (gbPoll[p] || 0).toFixed(1);
    const col = document.createElement('div');
    col.className = 'inp-col';
    col.innerHTML = `
      <div class="inp-label" style="color:${COLOURS[p]}">${LABELS[p]}</div>
      <input class="inp-field" id="gb_${p}" type="number" step="0.1" min="0" max="70"
        value="${val}" style="color:${COLOURS[p]};border-color:${COLOURS[p]}55"
        oninput="onGBChange()">`;
    grid.appendChild(col);
  }

  // Controls row under GB inputs
  const ctrl = document.getElementById('controls-gb');
  ctrl.innerHTML = `
    <div class="controls" style="display:flex;align-items:center;gap:8px;padding:4px 0 8px;flex-wrap:wrap">
      <span class="total-label">Total:</span>
      <span class="total-val" id="gb-total">—</span>
      <span class="spacer"></span>
      <button class="ctrl-btn" onclick="normaliseGB()">Normalise to 100%</button>
      <button class="ctrl-btn" onclick="resetGB()">Reset to live poll</button>
    </div>`;
  updateGBTotal();
}

function updateGBTotal() {
  let t = 0;
  PARTIES.forEach(p => { t += parseFloat(document.getElementById('gb_' + p)?.value || 0) || 0; });
  const el = document.getElementById('gb-total');
  if (el) { el.textContent = t.toFixed(1) + '%'; el.style.color = Math.abs(t-100) < 0.5 ? '#02A95B' : '#E4003B'; }
}

function onGBChange() {
  updateGBTotal();
  // When user changes GB inputs, propagate the delta to regional inputs
  // so regional panels stay in sync
  const gbPoll = getGBPoll();
  REGIONS.forEach(region => {
    if (!livePollMap[region]) return;
    PARTIES.forEach(p => {
      const el = document.getElementById(`reg_${region}_${p}`);
      if (!el) return;
      // Regional = live regional + (new GB - live GB)
      const liveGB  = livePollMap['GB-wide']?.[p] || 0;
      const liveReg = livePollMap[region][p] || 0;
      const newVal  = Math.max(0, liveReg + (gbPoll[p] - liveGB));
      el.value = newVal.toFixed(1);
      el.style.color = COLOURS[p];
    });
    updateRegTotal(region);
  });
}

function normaliseGB() {
  let t = 0;
  PARTIES.forEach(p => { t += parseFloat(document.getElementById('gb_' + p)?.value || 0) || 0; });
  if (t <= 0) return;
  PARTIES.forEach(p => {
    const el = document.getElementById('gb_' + p);
    if (el) el.value = ((parseFloat(el.value)||0) / t * 100).toFixed(1);
  });
  updateGBTotal();
  onGBChange();
}

function resetGB() {
  const gbPoll = livePollMap['GB-wide'] || {};
  PARTIES.forEach(p => {
    const el = document.getElementById('gb_' + p);
    if (el) el.value = (gbPoll[p] || 0).toFixed(1);
  });
  updateGBTotal();
  // Reset regional panels too
  REGIONS.forEach(region => {
    if (!livePollMap[region]) return;
    PARTIES.forEach(p => {
      const el = document.getElementById(`reg_${region}_${p}`);
      if (el) el.value = (livePollMap[region][p] || 0).toFixed(1);
    });
    updateRegTotal(region);
  });
}

function getGBPoll() {
  const n = {};
  PARTIES.forEach(p => n[p] = parseFloat(document.getElementById('gb_' + p)?.value || 0) || 0);
  return n;
}

// ── Build regional input panels ───────────────────────────────────────────────
function buildRegionalInputs(pollMap) {
  const container = document.getElementById('regional-panels');
  container.innerHTML = '';

  for (const region of REGIONS) {
    const regPoll = pollMap[region] || pollMap['GB-wide'] || {};
    const block = document.createElement('div');
    block.className = 'region-block';

    let inputs = '';
    for (const p of PARTIES) {
      const val = (regPoll[p] || 0).toFixed(1);
      inputs += `
        <div class="inp-col">
          <div class="inp-label" style="color:${COLOURS[p]}">${LABELS[p]}</div>
          <input class="inp-field" id="reg_${region}_${p}" type="number" step="0.1" min="0" max="70"
            value="${val}" style="color:${COLOURS[p]};border-color:${COLOURS[p]}55"
            oninput="updateRegTotal('${region}')">
        </div>`;
    }

    block.innerHTML = `
      <div class="region-name">${region}</div>
      <div class="region-grid">${inputs}</div>
      <div style="display:flex;align-items:center;gap:8px;padding:4px 0 8px;flex-wrap:wrap">
        <span class="total-label">Total:</span>
        <span class="total-val" id="reg-total-${region.replace(/ /g,'_')}">—</span>
        <span style="flex:1"></span>
        <button class="ctrl-btn" onclick="normaliseReg('${region}')">Normalise</button>
        <button class="ctrl-btn" onclick="resetReg('${region}')">Reset</button>
      </div>`;
    container.appendChild(block);
    updateRegTotal(region);
  }
}

function updateRegTotal(region) {
  let t = 0;
  PARTIES.forEach(p => { t += parseFloat(document.getElementById(`reg_${region}_${p}`)?.value || 0) || 0; });
  const key = region.replace(/ /g, '_');
  const el  = document.getElementById('reg-total-' + key);
  if (el) { el.textContent = t.toFixed(1) + '%'; el.style.color = Math.abs(t-100) < 0.5 ? '#02A95B' : '#E4003B'; }
}

function normaliseReg(region) {
  let t = 0;
  PARTIES.forEach(p => { t += parseFloat(document.getElementById(`reg_${region}_${p}`)?.value || 0) || 0; });
  if (t <= 0) return;
  PARTIES.forEach(p => {
    const el = document.getElementById(`reg_${region}_${p}`);
    if (el) el.value = ((parseFloat(el.value)||0) / t * 100).toFixed(1);
  });
  updateRegTotal(region);
}

function resetReg(region) {
  const regPoll = livePollMap[region] || livePollMap['GB-wide'] || {};
  PARTIES.forEach(p => {
    const el = document.getElementById(`reg_${region}_${p}`);
    if (el) el.value = (regPoll[p] || 0).toFixed(1);
  });
  updateRegTotal(region);
}

// ── Build poll map from current inputs ───────────────────────────────────────
// When user runs: build a pollMap from whichever tab is active
// GB-wide tab: apply GB delta to each region's live poll
// Regional tab: use regional inputs directly
function buildUserPollMap() {
  const activeTab = document.querySelector('.tab.active')?.textContent?.trim();
  const pollMap = {};

  if (activeTab === 'GB-wide') {
    const gbPoll  = getGBPoll();
    const liveGB  = livePollMap['GB-wide'] || GB_2024;
    // GB-wide row
    pollMap['GB-wide'] = {...gbPoll};
    // Each region: live regional + GB delta
    for (const region of REGIONS) {
      const liveReg = livePollMap[region] || liveGB;
      pollMap[region] = {};
      PARTIES.forEach(p => {
        const delta = (gbPoll[p] || 0) - (liveGB[p] || 0);
        pollMap[region][p] = Math.max(0, (liveReg[p] || 0) + delta);
      });
    }
  } else {
    // Regional tab — read each region's inputs directly
    pollMap['GB-wide'] = getGBPoll();
    for (const region of REGIONS) {
      pollMap[region] = {};
      PARTIES.forEach(p => {
        pollMap[region][p] = parseFloat(document.getElementById(`reg_${region}_${p}`)?.value || 0) || 0;
      });
    }
  }
  return pollMap;
}

// ── Option C model ────────────────────────────────────────────────────────────
function runModel(pollMap) {
  const counts = {};
  PARTIES.forEach(p => counts[p] = 0);

  for (const seat of resultRows) {
    const code   = (seat['PCON24CD'] || '').trim();
    const region = (seat['Region']   || '').trim();
    if (!code || region === 'Northern Ireland') continue;

    const regPoll = pollMap[region] || pollMap['GB-wide'] || {};
    const p = params[code] || {};
    const shares = {};

    for (const party of PARTIES) {
      const raw = parseFloat(seat[party + '_pct'] || 0);
      const local2024 = party === 'oth'
        ? (raw + parseFloat(seat['rstr_pct'] || 0) + parseFloat(seat['ind_pct'] || 0)) / 100
        : raw / 100;

      const regPollPct = (regPoll[party] || 0) / 100;
      // Swing vs regional 2024 result — NOT GB 2024 average
      // This is critical: SNP poll 32.4% vs Scotland 2024 30.0% = +2.4pt swing
      // NOT vs GB 2024 2.5% which would give a false +29.9pt swing
      const regBase2024  = (BASELINE_2024[region] || BASELINE_2024['GB-wide'])[party] || 0;
      const swing        = regPollPct - regBase2024 / 100;
      const headroom   = Math.max(0, 1 - local2024);
      const mult       = parseFloat(p[party + '_multiplier'] || 1) || 1;
      const frac       = parseFloat(p[party + '_fraction']   || 0.2) || 0.2;
      const floor      = local2024 * frac;

      shares[party] = Math.max(floor, Math.max(0, local2024 + swing * headroom * 2 * mult));
    }

    const total = Object.values(shares).reduce((a, b) => a + b, 0);
    if (total > 0) PARTIES.forEach(p => shares[p] /= total);

    let winner = 'oth', best = 0;
    PARTIES.forEach(p => { if (shares[p] > best) { best = shares[p]; winner = p; } });
    counts[winner] = (counts[winner] || 0) + 1;
  }
  return counts;
}

// ── Run forecast ──────────────────────────────────────────────────────────────
function runForecast() {
  const pollMap = buildUserPollMap();
  const seats   = runModel(pollMap);

  // Render results
  const grid = document.getElementById('results-grid');
  grid.innerHTML = '';
  document.getElementById('results-wrap').style.display = 'block';

  const sorted = [...TILE_ORDER].sort((a, b) => (seats[b] || 0) - (seats[a] || 0));
  const maxS   = Math.max(...Object.values(seats), 1);

  for (const p of sorted) {
    const count = seats[p] || 0, prev = SEATS_2024[p] || 0, diff = count - prev;
    const col = document.createElement('div');
    col.className = 'r-col';
    col.innerHTML = `
      <div class="r-party"  style="color:${COLOURS[p]}">${LABELS[p]}</div>
      <div class="r-seats"  style="color:${COLOURS[p]}">${count}</div>
      <div class="r-change" style="color:${COLOURS[p]}">${diff >= 0 ? '+' : ''}${diff}</div>
      <div class="r-bar-bg"><div class="r-bar" style="background:${COLOURS[p]};width:${Math.round(count/maxS*100)}%"></div></div>`;
    grid.appendChild(col);
  }

  // Tell map to update
  window.parent.postMessage({ action: 'forecastUpdate', pollMap }, '*');
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const [pollRows, rRows, pRows] = await Promise.all([
      fetchCSV(POLL_CSV),
      fetchCSV(RESULTS_URL),
      fetchCSV(PARAMS_CSV),
    ]);

    resultRows  = rRows;
    livePollMap = buildPollMap(pollRows);
    pRows.forEach(r => { const c = (r['PCON24CD'] || '').trim(); if (c) params[c] = r; });

    const gbPoll = livePollMap['GB-wide'];
    if (!gbPoll) throw new Error('GB-wide row not found in polling CSV');

    buildGBInputs(gbPoll);
    buildRegionalInputs(livePollMap);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('wrap').style.display    = 'block';

    document.getElementById('status').textContent =
      `Option C · ${rRows.length} seats · ${Object.keys(params).length} with parameters`;

  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display   = 'block';
    document.getElementById('error').textContent     = 'Error: ' + e.message;
    console.error('iframe2:', e);
  }
}

init();
</script>
</body>
</html>
