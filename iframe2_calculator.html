<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Britain Predicts — Calculator</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Arial,sans-serif; background:#fff; font-size:13px; }
#loading { padding:24px; color:#999; text-align:center; }
#error   { padding:16px; color:#c00; font-size:12px; display:none; }
#wrap    { display:none; }
#header  { padding:10px 16px 8px; border-bottom:2px solid #111; }
#header h2 { font-size:13px; font-weight:700; color:#111; }
#header p  { font-size:10px; color:#888; margin-top:2px; }
#tabs { display:flex; border-bottom:1px solid #ddd; padding:0 16px; margin-top:8px; }
.tab { padding:7px 14px 6px; font-size:11px; font-weight:700; color:#999;
       border-bottom:2px solid transparent; cursor:pointer; margin-bottom:-1px; }
.tab.active { color:#111; border-bottom-color:#111; }
.panel { display:none; padding:12px 16px 8px; }
.panel.active { display:block; }
.grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
.grid8 { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-bottom:10px; }
@media(min-width:500px){ .grid4 { grid-template-columns:repeat(8,1fr); } }
.ic { display:flex; flex-direction:column; align-items:center; gap:3px; }
.il { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.if { width:100%; border:1.5px solid #ddd; border-radius:3px; text-align:center;
      font-size:13px; font-weight:700; padding:5px 2px; outline:none; }
.if:focus { border-color:#111; }
.rblock { margin-bottom:14px; }
.rname  { font-size:10px; font-weight:700; color:#555; text-transform:uppercase;
          letter-spacing:.05em; margin-bottom:6px; }
.ctrl   { display:flex; align-items:center; gap:8px; padding:4px 0 4px; flex-wrap:wrap; }
.tlbl   { font-size:11px; color:#888; }
.tval   { font-size:11px; font-weight:700; }
.cbtn   { padding:4px 10px; border:1px solid #ddd; border-radius:3px;
          font-size:10px; font-weight:700; cursor:pointer; background:#fff; color:#555; }
.cbtn:hover { background:#f5f5f5; }
#run-wrap { padding:4px 16px 10px; }
#run-btn  { width:100%; padding:10px; background:#111; color:#fff; border:none;
            border-radius:4px; font-size:13px; font-weight:700; cursor:pointer; }
#run-btn:hover { background:#333; }
#results  { padding:0 16px 12px; display:none; }
#rlbl     { font-size:10px; font-weight:700; color:#666; text-transform:uppercase;
            letter-spacing:.05em; margin-bottom:8px; }
#rgrid    { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
@media(min-width:500px){ #rgrid { grid-template-columns:repeat(8,1fr); } }
.rc  { display:flex; flex-direction:column; align-items:center; gap:3px; }
.rp  { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.rs  { font-size:22px; font-weight:700; line-height:1; }
.rch { font-size:10px; }
.rbg { width:100%; height:3px; background:#eee; border-radius:2px; }
.rb  { height:100%; border-radius:2px; }
#status { font-size:9px; color:#ccc; text-align:right; padding:2px 16px 8px; }
</style>
</head>
<body>
<div id="loading">Loading…</div>
<div id="error"></div>
<div id="wrap">
  <div id="header">
    <h2>Britain Predicts — Create Your Forecast</h2>
    <p>Adjust poll shares then run — changes update the map</p>
  </div>
  <div id="tabs">
    <div class="tab active" onclick="showTab('gb')">GB-wide</div>
    <div class="tab"        onclick="showTab('reg')">By region</div>
  </div>
  <div id="panel-gb"  class="panel active"><div id="gb-grid"  class="grid4"></div><div id="gb-ctrl" class="ctrl"></div></div>
  <div id="panel-reg" class="panel"><div id="reg-panels"></div></div>
  <div id="run-wrap"><button id="run-btn" onclick="run()">Run forecast ›</button></div>
  <div id="results"><div id="rlbl">Projected seats</div><div id="rgrid"></div></div>
  <div id="status"></div>
</div>
<script>
const BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=';
const POLL_CSV = BASE_URL + '0&single=true&output=csv';

const PARTIES = ['con','lab','ldem','grn','snp','pc','ref','oth'];
const REGIONS = ['Scotland','Wales','Northern England','Southern England','Midlands','London'];
const LABELS  = {con:'Con',lab:'Lab',ldem:'LDem',grn:'Grn',snp:'SNP',pc:'PC',ref:'Reform',oth:'Other'};
const COLOURS = {con:'#0087DC',lab:'#E4003B',ldem:'#FAA61A',grn:'#02A95B',snp:'#C8A400',pc:'#3F8428',ref:'#12B6CF',oth:'#57534e'};
const S24     = {con:121,lab:412,ldem:72,grn:4,snp:9,pc:4,ref:5,oth:5};

let livePollMap = {};

function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l=>l.trim());
  if (!lines.length) return [];
  const sep = lines[0].includes('\t') ? '\t' : ',';
  const h = lines[0].split(sep).map(s=>s.trim());
  return lines.slice(1).map(line => {
    const v = line.split(sep).map(s=>s.trim()), o = {};
    h.forEach((k,i) => o[k] = v[i]||'');
    return o;
  });
}

function buildPollMap(rows) {
  const map = {};
  for (const row of rows) {
    const region = (row['region']||row['Region']||Object.values(row)[0]||'').trim();
    if (!region) continue;
    map[region] = {};
    PARTIES.forEach(p => {
      map[region][p] = p==='oth'
        ? (parseFloat(row['oth_pct']||0)||0)+(parseFloat(row['rstr_pct']||0)||0)
        : parseFloat(row[p+'_pct']||0)||0;
    });
  }
  return map;
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active',['gb','reg'][i]===tab));
  document.getElementById('panel-gb').classList.toggle('active', tab==='gb');
  document.getElementById('panel-reg').classList.toggle('active', tab==='reg');
}

function val(id) { return parseFloat(document.getElementById(id)?.value||0)||0; }
function setVal(id, v) { const el=document.getElementById(id); if(el) el.value=v.toFixed(1); }

function updateTotal(prefix) {
  let t=0; PARTIES.forEach(p=>{t+=val(prefix+p);}); 
  const el=document.getElementById('tot-'+prefix);
  if(el){el.textContent=t.toFixed(1)+'%'; el.style.color=Math.abs(t-100)<0.5?'#02A95B':'#E4003B';}
}

function buildGBInputs(gbPoll) {
  const grid = document.getElementById('gb-grid');
  grid.innerHTML = '';
  PARTIES.forEach(p => {
    const col = document.createElement('div'); col.className='ic';
    col.innerHTML=`<div class="il" style="color:${COLOURS[p]}">${LABELS[p]}</div>
      <input class="if" id="gb_${p}" type="number" step="0.1" min="0" max="70"
        value="${(gbPoll[p]||0).toFixed(1)}" style="color:${COLOURS[p]};border-color:${COLOURS[p]}44"
        oninput="onGBChange()">`;
    grid.appendChild(col);
  });
  document.getElementById('gb-ctrl').innerHTML=`
    <span class="tlbl">Total:</span><span class="tval" id="tot-gb_">—</span>
    <span style="flex:1"></span>
    <button class="cbtn" onclick="normalise('gb_')">Normalise</button>
    <button class="cbtn" onclick="resetGB()">Reset</button>`;
  updateTotal('gb_');
}

function onGBChange() {
  updateTotal('gb_');
  // Propagate GB delta to regional inputs
  const liveGB = livePollMap['GB-wide'] || {};
  REGIONS.forEach(region => {
    if (!livePollMap[region]) return;
    PARTIES.forEach(p => {
      const delta = val('gb_'+p) - (liveGB[p]||0);
      setVal('reg_'+region+'_'+p, Math.max(0,(livePollMap[region][p]||0)+delta));
    });
    updateTotal('reg_'+region+'_');
  });
}

function normalise(prefix) {
  let t=0; PARTIES.forEach(p=>{t+=val(prefix+p);});
  if(t<=0) return;
  PARTIES.forEach(p=>{setVal(prefix+p,(val(prefix+p)/t*100));});
  updateTotal(prefix);
  if(prefix==='gb_') onGBChange();
}

function resetGB() {
  const gb=livePollMap['GB-wide']||{};
  PARTIES.forEach(p=>{setVal('gb_'+p,gb[p]||0);});
  updateTotal('gb_');
  REGIONS.forEach(region=>{
    if(!livePollMap[region]) return;
    PARTIES.forEach(p=>{setVal('reg_'+region+'_'+p,livePollMap[region][p]||0);});
    updateTotal('reg_'+region+'_');
  });
}

function buildRegInputs(pollMap) {
  const container=document.getElementById('reg-panels');
  container.innerHTML='';
  REGIONS.forEach(region=>{
    const rp=pollMap[region]||pollMap['GB-wide']||{};
    let inputs='';
    PARTIES.forEach(p=>{inputs+=`<div class="ic">
      <div class="il" style="color:${COLOURS[p]}">${LABELS[p]}</div>
      <input class="if" id="reg_${region}_${p}" type="number" step="0.1" min="0" max="70"
        value="${(rp[p]||0).toFixed(1)}" style="color:${COLOURS[p]};border-color:${COLOURS[p]}44"
        oninput="updateTotal('reg_${region}_')">
    </div>`;});
    const block=document.createElement('div'); block.className='rblock';
    block.innerHTML=`<div class="rname">${region}</div>
      <div class="grid4">${inputs}</div>
      <div class="ctrl">
        <span class="tlbl">Total:</span><span class="tval" id="tot-reg_${region}_">—</span>
        <span style="flex:1"></span>
        <button class="cbtn" onclick="normalise('reg_${region}_')">Normalise</button>
        <button class="cbtn" onclick="resetReg('${region}')">Reset</button>
      </div>`;
    container.appendChild(block);
    updateTotal('reg_'+region+'_');
  });
}

function resetReg(region) {
  const rp=livePollMap[region]||livePollMap['GB-wide']||{};
  PARTIES.forEach(p=>{setVal('reg_'+region+'_'+p,rp[p]||0);});
  updateTotal('reg_'+region+'_');
}

function buildUserPollMap() {
  const activeTab=document.querySelector('.tab.active')?.textContent?.trim();
  const map={};
  if(activeTab==='GB-wide'){
    const liveGB=livePollMap['GB-wide']||{};
    map['GB-wide']={};
    PARTIES.forEach(p=>{map['GB-wide'][p]=val('gb_'+p);});
    REGIONS.forEach(region=>{
      const liveReg=livePollMap[region]||liveGB;
      map[region]={};
      PARTIES.forEach(p=>{
        map[region][p]=Math.max(0,(liveReg[p]||0)+(val('gb_'+p)-(liveGB[p]||0)));
      });
    });
  } else {
    map['GB-wide']={};
    PARTIES.forEach(p=>{map['GB-wide'][p]=val('gb_'+p);});
    REGIONS.forEach(region=>{
      map[region]={};
      PARTIES.forEach(p=>{map[region][p]=val('reg_'+region+'_'+p);});
    });
  }
  return map;
}

function run() {
  const pollMap=buildUserPollMap();
  // Send to iframe3 via parent — iframe3 runs model and broadcasts results
  window.parent.postMessage({action:'forecastUpdate', pollMap}, '*');
  document.getElementById('results').style.display='block';
  document.getElementById('rgrid').innerHTML='<div style="padding:8px;color:#999;font-size:11px">Updating map…</div>';
}

// Receive seat counts back from iframe3 (via parent relay) to show in calculator results
window.addEventListener('message', e => {
  if (e.data && e.data.action==='seatCounts' && e.data.counts) {
    const counts=e.data.counts;
    const grid=document.getElementById('rgrid');
    if (!grid) return;
    grid.innerHTML='';
    const sorted=Object.keys(counts).sort((a,b)=>(counts[b]||0)-(counts[a]||0));
    const maxS=Math.max(...Object.values(counts),1);
    for(const p of sorted){
      const n=counts[p]||0,prev=S24[p]||0,d=n-prev;
      const col=document.createElement('div'); col.className='rc';
      col.innerHTML=`<div class="rp" style="color:${COLOURS[p]||'#999'}">${LABELS[p]||p}</div>
        <div class="rs" style="color:${COLOURS[p]||'#999'}">${n}</div>
        <div class="rch" style="color:${COLOURS[p]||'#999'}">${d>=0?'+':''}${d}</div>
        <div class="rbg"><div class="rb" style="background:${COLOURS[p]||'#999'};width:${Math.round(n/maxS*100)}%"></div></div>`;
      grid.appendChild(col);
    }
    document.getElementById('results').style.display='block';
  }
});

async function init() {
  try {
    const r = await fetch(POLL_CSV+'&_='+Date.now());
    if (!r.ok) throw new Error('Poll fetch failed '+r.status);
    livePollMap = buildPollMap(parseCSV(await r.text()));
    const gb = livePollMap['GB-wide'];
    if (!gb) throw new Error('GB-wide row not found in polling CSV');
    buildGBInputs(gb);
    buildRegInputs(livePollMap);
    document.getElementById('loading').style.display='none';
    document.getElementById('wrap').style.display='block';
    document.getElementById('status').textContent='Polling CSV loaded · run to update map';
  } catch(e) {
    document.getElementById('loading').style.display='none';
    document.getElementById('error').style.display='block';
    document.getElementById('error').textContent='Error: '+e.message;
    console.error('iframe2:',e);
  }
}
init();
</script>
</body>
</html>
