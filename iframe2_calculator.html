<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Britain Predicts — Calculator</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Arial',sans-serif; background:#fff; font-size:13px; }
#loading { padding:24px; color:#999; text-align:center; }
#error   { padding:24px; color:#c00; font-size:12px; display:none; }
#wrap    { display:none; }
#header  { padding:10px 16px 8px; border-bottom:2px solid #111; }
#header h2 { font-size:13px; font-weight:700; color:#111; }
#header p  { font-size:10px; color:#888; margin-top:2px; }
#tabs { display:flex; border-bottom:1px solid #ddd; padding:0 16px; margin-top:8px; }
.tab { padding:7px 14px 6px; font-size:11px; font-weight:700; color:#999;
       border-bottom:2px solid transparent; cursor:pointer; margin-bottom:-1px; }
.tab.active { color:#111; border-bottom-color:#111; }
.panel { display:none; padding:12px 16px 8px; }
.panel.active { display:block; }
#gb-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
@media(min-width:500px){ #gb-grid { grid-template-columns:repeat(8,1fr); } }
.inp-col   { display:flex; flex-direction:column; align-items:center; gap:3px; }
.inp-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.inp-field { width:100%; border:1.5px solid #ddd; border-radius:3px; text-align:center;
             font-size:13px; font-weight:700; padding:5px 2px; outline:none; }
.inp-field:focus { border-color:#111; }
.region-block { margin-bottom:12px; }
.region-name  { font-size:10px; font-weight:700; color:#666; text-transform:uppercase;
                letter-spacing:.05em; margin-bottom:6px; }
.region-grid  { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
@media(min-width:500px){ .region-grid { grid-template-columns:repeat(8,1fr); } }
.controls { display:flex; align-items:center; gap:8px; padding:4px 0 8px; flex-wrap:wrap; }
.total-label { font-size:11px; color:#888; }
.total-val   { font-size:11px; font-weight:700; }
.ctrl-btn { padding:5px 10px; border:1px solid #ddd; border-radius:3px;
            font-size:10px; font-weight:700; cursor:pointer; background:#fff; color:#555; }
.ctrl-btn:hover { background:#f5f5f5; }
#run-wrap { padding:0 16px 10px; }
#run-btn  { width:100%; padding:10px; background:#111; color:#fff; border:none;
            border-radius:4px; font-size:13px; font-weight:700; cursor:pointer; }
#run-btn:hover { background:#333; }
#results-wrap  { padding:0 16px 12px; display:none; }
#results-label { font-size:10px; font-weight:700; color:#666; text-transform:uppercase;
                 letter-spacing:.05em; margin-bottom:8px; }
#results-grid  { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
@media(min-width:500px){ #results-grid { grid-template-columns:repeat(8,1fr); } }
.r-col    { display:flex; flex-direction:column; align-items:center; gap:3px; }
.r-party  { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.r-seats  { font-size:22px; font-weight:700; line-height:1; }
.r-change { font-size:10px; }
.r-bar-bg { width:100%; height:3px; background:#eee; border-radius:2px; }
.r-bar    { height:100%; border-radius:2px; }
#status { font-size:9px; color:#ccc; text-align:right; padding:2px 16px 8px; }
</style>
</head>
<body>
<div id="loading">Loading…</div>
<div id="error"></div>
<div id="wrap">
  <div id="header">
    <h2>Britain Predicts — Create Your Forecast</h2>
    <p>Set national or regional poll shares, then run</p>
  </div>
  <div id="tabs">
    <div class="tab active" onclick="showTab('gb')">GB-wide</div>
    <div class="tab" onclick="showTab('regional')">By region</div>
  </div>
  <div id="panel-gb" class="panel active">
    <div id="gb-grid"></div>
    <div id="controls-gb"></div>
  </div>
  <div id="panel-regional" class="panel">
    <div id="regional-panels"></div>
  </div>
  <div id="run-wrap">
    <button id="run-btn" onclick="runForecast()">Run forecast ›</button>
  </div>
  <div id="results-wrap">
    <div id="results-label">Projected seats</div>
    <div id="results-grid"></div>
  </div>
  <div id="status"></div>
</div>

<script>
const POLL_CSV     = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=0&single=true&output=csv";
const RESULTS_URL  = "https://raw.githubusercontent.com/glasgow46239/britainpredicts/main/results_2024.csv";
const PARAMS_CSV   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=1932049493&single=true&output=csv";
const OVERRIDE_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=322317408&single=true&output=csv";
const STANDING_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=804182419&single=true&output=csv";

const PARTIES    = ['con','lab','ldem','grn','snp','pc','ref','oth'];
const REGIONS    = ['Scotland','Wales','Northern England','Southern England','Midlands','London'];
const TILE_ORDER = ['lab','ref','con','ldem','grn','snp','pc','oth'];
const LABELS     = {con:'Con',lab:'Lab',ldem:'LDem',grn:'Grn',snp:'SNP',pc:'PC',ref:'Reform',oth:'Other'};
const COLOURS    = {con:'#0087DC',lab:'#E4003B',ldem:'#FAA61A',grn:'#02A95B',snp:'#C8A400',pc:'#3F8428',ref:'#12B6CF',oth:'#57534e'};
const SEATS_2024 = {con:121,lab:412,ldem:72,grn:4,snp:9,pc:4,ref:5,oth:5};
const GB_2024    = {con:23.7,lab:33.7,ldem:12.2,grn:6.4,snp:2.5,pc:0.7,ref:14.3,oth:6.2};
const FRESH      = {con:12,lab:10,ldem:8,grn:5,snp:18,pc:12,ref:16,oth:3};
const BASELINE_2024 = {
  'GB-wide':         {con:23.7,lab:33.7,ldem:12.2,grn:6.4, snp:2.5, pc:0.7, ref:14.3,oth:6.2},
  'Scotland':        {con:12.7,lab:35.3,ldem:9.7, grn:3.8, snp:30.0,pc:0,   ref:7.0, oth:1.5},
  'Wales':           {con:18.2,lab:37.0,ldem:6.5, grn:4.7, snp:0,   pc:14.8,ref:16.9,oth:1.9},
  'Northern England':{con:19.6,lab:43.6,ldem:6.9, grn:7.2, snp:0,   pc:0,   ref:17.4,oth:5.3},
  'Southern England':{con:29.7,lab:26.5,ldem:19.4,grn:7.1, snp:0,   pc:0,   ref:15.1,oth:2.1},
  'Midlands':        {con:27.7,lab:35.2,ldem:7.3, grn:6.4, snp:0,   pc:0,   ref:18.6,oth:4.8},
  'London':          {con:20.6,lab:43.0,ldem:11.0,grn:10.0,snp:0,   pc:0,   ref:8.7, oth:6.7},
};

let resultRows=[], params={}, overrides={}, standing={}, livePollMap={};

async function fetchWithRetry(url, retries=3) {
  for (let i=0; i<retries; i++) {
    try {
      const r = await fetch(url + (url.includes('?')?'&':'?') + '_=' + Date.now());
      if (r.ok) return r;
      if (i === retries-1) throw new Error('HTTP ' + r.status);
    } catch(e) {
      if (i === retries-1) throw e;
      await new Promise(r => setTimeout(r, 600 * (i+1)));
    }
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (!lines.length) return [];
  const sep = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(sep).map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(sep).map(v => v.trim());
    const obj = {};
    headers.forEach((h,i) => obj[h] = vals[i] !== undefined ? vals[i] : '');
    return obj;
  });
}
async function fetchCSV(url) {
  const r = await fetchWithRetry(url);
  if (!r || !r.ok) throw new Error('Fetch failed ' + (r?.status||'network error'));
  return parseCSV(await r.text());
}

function buildPollMap(rows) {
  const map = {};
  for (const row of rows) {
    const region = (row['region']||row['Region']||Object.values(row)[0]||'').trim();
    if (!region) continue;
    map[region] = {
      con: parseFloat(row['con_pct']||0)||0, lab: parseFloat(row['lab_pct']||0)||0,
      ldem:parseFloat(row['ldem_pct']||0)||0,grn: parseFloat(row['grn_pct']||0)||0,
      snp: parseFloat(row['snp_pct']||0)||0, pc:  parseFloat(row['pc_pct']||0)||0,
      ref: parseFloat(row['ref_pct']||0)||0,
      oth:(parseFloat(row['oth_pct']||0)||0)+(parseFloat(row['rstr_pct']||0)||0),
    };
  }
  return map;
}
function buildOverrideMap(rows) {
  const map = {};
  for (const row of rows) {
    const code = (row['PCON24CD']||'').trim(); if (!code) continue;
    const ovr = {};
    PARTIES.forEach(p => { const v=parseFloat(row[p]); if(!isNaN(v)&&v>0&&row[p]!==''&&row[p]!=='0') ovr[p]=v; });
    if (Object.keys(ovr).length) map[code] = ovr;
  }
  return map;
}
function buildStandingMap(rows) {
  const map = {};
  for (const row of rows) {
    const code = (row['PCON24CD']||'').trim(); if (!code) continue;
    const std = {};
    PARTIES.forEach(p => { std[p] = row[p] !== '0'; });
    map[code] = std;
  }
  return map;
}

function runOptionC(seat, pollMap) {
  const code   = (seat['PCON24CD']||'').trim();
  const region = (seat['Region']||seat['region']||'').trim();
  const p      = params[code]   || {};
  const ovr    = overrides[code] || {};
  const std    = standing[code];
  const regPoll = pollMap[region] || pollMap['GB-wide'] || GB_2024;
  const regBase = BASELINE_2024[region] || BASELINE_2024['GB-wide'];
  const raw = {};

  PARTIES.forEach(party => {
    const isStanding = std ? std[party] : true;
    if (!isStanding) { raw[party] = 0; return; }
    let local2024 = parseFloat(seat[party+'_pct']||seat[party+'pct']||seat[party]||0)||0;
    if (party==='oth') local2024 += parseFloat(seat['rstr_pct']||0)||0;
    local2024 /= 100;
    if (local2024===0 && isStanding) local2024 = (FRESH[party]||3)/100;
    const swing    = (regPoll[party]||0)/100 - (regBase[party]||0)/100;
    const headroom = Math.max(0, 1-local2024);
    const mult     = Math.min(1.7, Math.max(0.25, parseFloat(p[party+'_multiplier']||1)||1));
    const frac     = parseFloat(p[party+'_fraction']||0.2)||0.2;
    raw[party]     = Math.max(local2024*frac, Math.max(0, local2024+swing*headroom*2*mult));
  });

  const pinnedParties = Object.keys(ovr);
  if (pinnedParties.length > 0) {
    const pinnedTotal  = pinnedParties.reduce((s, p) => s + ovr[p], 0);
    const freeParties  = PARTIES.filter(p => !pinnedParties.includes(p));
    const freeRawTotal = freeParties.reduce((s, p) => s + (raw[p]||0), 0);
    const freeScale    = freeRawTotal > 0 ? Math.max(0, 100 - pinnedTotal) / freeRawTotal : 0;
    pinnedParties.forEach(p => raw[p] = ovr[p] / 100);
    freeParties.forEach(p => raw[p] = (raw[p]||0) * freeScale / 100);
  } else {
    const total = PARTIES.reduce((s, p) => s + (raw[p]||0), 0);
    if (total > 0) PARTIES.forEach(p => raw[p] = (raw[p]||0) / total);
  }

  let winner = 'oth', best = 0;
  PARTIES.forEach(p => { if ((raw[p]||0) > best) { best = raw[p]; winner = p; } });
  return {winner, shares:raw};
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active',['gb','regional'][i]===tab));
  document.getElementById('panel-gb').classList.toggle('active', tab==='gb');
  document.getElementById('panel-regional').classList.toggle('active', tab==='regional');
}

function updateTotal(suffix, parties_list) {
  let t=0;
  (parties_list||PARTIES).forEach(p => { const el=document.getElementById(suffix+p); if(el) t+=parseFloat(el.value)||0; });
  const el = document.getElementById('total-'+suffix);
  if (el) { el.textContent=t.toFixed(1)+'%'; el.style.color=Math.abs(t-100)<0.5?'#02A95B':'#E4003B'; }
}

function buildGBInputs(gbPoll) {
  const grid = document.getElementById('gb-grid');
  grid.innerHTML = '';
  PARTIES.forEach(p => {
    const val = (gbPoll[p]||0).toFixed(1);
    const col = document.createElement('div'); col.className='inp-col';
    col.innerHTML=`<div class="inp-label" style="color:${COLOURS[p]}">${LABELS[p]}</div>
      <input class="inp-field" id="gb_${p}" type="number" step="0.1" min="0" max="70"
        value="${val}" style="color:${COLOURS[p]};border-color:${COLOURS[p]}44"
        oninput="onGBChange()">`;
    grid.appendChild(col);
  });
  const ctrl = document.getElementById('controls-gb');
  ctrl.innerHTML=`<div class="controls">
    <span class="total-label">Total:</span><span class="total-val" id="total-gb_">—</span>
    <span style="flex:1"></span>
    <button class="ctrl-btn" onclick="normaliseGB()">Normalise</button>
    <button class="ctrl-btn" onclick="resetGB()">Reset</button>
  </div>`;
  updateTotal('gb_');
}

function onGBChange() {
  updateTotal('gb_');
  const gbPoll = getGBPoll();
  const liveGB = livePollMap['GB-wide'] || GB_2024;
  REGIONS.forEach(region => {
    if (!livePollMap[region]) return;
    PARTIES.forEach(p => {
      const el = document.getElementById(`reg_${region}_${p}`);
      if (!el) return;
      el.value = Math.max(0, (livePollMap[region][p]||0) + (gbPoll[p]-(liveGB[p]||0))).toFixed(1);
    });
    updateTotal(`reg_${region}_`);
  });
}
function normaliseGB() {
  let t=0; PARTIES.forEach(p=>{t+=parseFloat(document.getElementById('gb_'+p)?.value||0)||0;});
  if(t<=0) return;
  PARTIES.forEach(p=>{const el=document.getElementById('gb_'+p);if(el)el.value=((parseFloat(el.value)||0)/t*100).toFixed(1);});
  updateTotal('gb_'); onGBChange();
}
function resetGB() {
  const gbPoll=livePollMap['GB-wide']||{};
  PARTIES.forEach(p=>{const el=document.getElementById('gb_'+p);if(el)el.value=(gbPoll[p]||0).toFixed(1);});
  updateTotal('gb_');
  REGIONS.forEach(region=>{
    if(!livePollMap[region]) return;
    PARTIES.forEach(p=>{const el=document.getElementById(`reg_${region}_${p}`);if(el)el.value=(livePollMap[region][p]||0).toFixed(1);});
    updateTotal(`reg_${region}_`);
  });
}
function getGBPoll() {
  const n={}; PARTIES.forEach(p=>n[p]=parseFloat(document.getElementById('gb_'+p)?.value||0)||0); return n;
}

function buildRegionalInputs(pollMap) {
  const container = document.getElementById('regional-panels');
  container.innerHTML='';
  REGIONS.forEach(region => {
    const regPoll = pollMap[region]||pollMap['GB-wide']||{};
    const block = document.createElement('div'); block.className='region-block';
    let inputs='';
    PARTIES.forEach(p => {
      inputs+=`<div class="inp-col">
        <div class="inp-label" style="color:${COLOURS[p]}">${LABELS[p]}</div>
        <input class="inp-field" id="reg_${region}_${p}" type="number" step="0.1" min="0" max="70"
          value="${(regPoll[p]||0).toFixed(1)}" style="color:${COLOURS[p]};border-color:${COLOURS[p]}44"
          oninput="updateTotal('reg_${region}_')">
      </div>`;
    });
    block.innerHTML=`<div class="region-name">${region}</div>
      <div class="region-grid">${inputs}</div>
      <div class="controls">
        <span class="total-label">Total:</span>
        <span class="total-val" id="total-reg_${region}_">—</span>
        <span style="flex:1"></span>
        <button class="ctrl-btn" onclick="normaliseReg('${region}')">Normalise</button>
        <button class="ctrl-btn" onclick="resetReg('${region}')">Reset</button>
      </div>`;
    container.appendChild(block);
    updateTotal(`reg_${region}_`);
  });
}
function normaliseReg(region) {
  let t=0; PARTIES.forEach(p=>{t+=parseFloat(document.getElementById(`reg_${region}_${p}`)?.value||0)||0;});
  if(t<=0) return;
  PARTIES.forEach(p=>{const el=document.getElementById(`reg_${region}_${p}`);if(el)el.value=((parseFloat(el.value)||0)/t*100).toFixed(1);});
  updateTotal(`reg_${region}_`);
}
function resetReg(region) {
  const rp=livePollMap[region]||livePollMap['GB-wide']||{};
  PARTIES.forEach(p=>{const el=document.getElementById(`reg_${region}_${p}`);if(el)el.value=(rp[p]||0).toFixed(1);});
  updateTotal(`reg_${region}_`);
}

function buildUserPollMap() {
  const activeTab = document.querySelector('.tab.active')?.textContent?.trim();
  const pollMap = {};
  if (activeTab==='GB-wide') {
    const gbPoll=getGBPoll(), liveGB=livePollMap['GB-wide']||GB_2024;
    pollMap['GB-wide']={...gbPoll};
    REGIONS.forEach(region=>{
      const liveReg=livePollMap[region]||liveGB;
      pollMap[region]={};
      PARTIES.forEach(p=>{ pollMap[region][p]=Math.max(0,(liveReg[p]||0)+(gbPoll[p]-(liveGB[p]||0))); });
    });
  } else {
    pollMap['GB-wide']=getGBPoll();
    REGIONS.forEach(region=>{
      pollMap[region]={};
      PARTIES.forEach(p=>{ pollMap[region][p]=parseFloat(document.getElementById(`reg_${region}_${p}`)?.value||0)||0; });
    });
  }
  return pollMap;
}

function runForecast() {
  const pollMap = buildUserPollMap();
  const counts = {}; PARTIES.forEach(p=>counts[p]=0);
  for (const seat of resultRows) {
    const region=(seat['Region']||seat['region']||'').trim();
    if(!seat['PCON24CD']||region==='Northern Ireland') continue;
    const result=runOptionC(seat, pollMap);
    counts[result.winner]=(counts[result.winner]||0)+1;
  }

  const grid=document.getElementById('results-grid');
  grid.innerHTML='';
  document.getElementById('results-wrap').style.display='block';
  const sorted=[...TILE_ORDER].sort((a,b)=>(counts[b]||0)-(counts[a]||0));
  const maxS=Math.max(...Object.values(counts),1);
  for (const p of sorted) {
    const count=counts[p]||0,prev=SEATS_2024[p]||0,diff=count-prev;
    const col=document.createElement('div'); col.className='r-col';
    col.innerHTML=`<div class="r-party" style="color:${COLOURS[p]}">${LABELS[p]}</div>
      <div class="r-seats" style="color:${COLOURS[p]}">${count}</div>
      <div class="r-change" style="color:${COLOURS[p]}">${diff>=0?'+':''}${diff}</div>
      <div class="r-bar-bg"><div class="r-bar" style="background:${COLOURS[p]};width:${Math.round(count/maxS*100)}%"></div></div>`;
    grid.appendChild(col);
  }
  window.parent.postMessage({action:'forecastUpdate', pollMap}, '*');
}

async function init() {
  try {
    const [pollRows,rRows,pRows,oRows,sRows] = await Promise.all([
      fetchCSV(POLL_CSV), fetchCSV(RESULTS_URL), fetchCSV(PARAMS_CSV),
      fetchCSV(OVERRIDE_CSV), fetchCSV(STANDING_CSV),
    ]);
    resultRows  = rRows;
    livePollMap = buildPollMap(pollRows);
    pRows.forEach(r=>{const c=(r['PCON24CD']||'').trim();if(c)params[c]=r;});
    overrides = buildOverrideMap(oRows);
    standing  = buildStandingMap(sRows);

    if (!livePollMap['GB-wide']) throw new Error('GB-wide row not found');

    buildGBInputs(livePollMap['GB-wide']);
    buildRegionalInputs(livePollMap);

    document.getElementById('loading').style.display='none';
    document.getElementById('wrap').style.display='block';
    document.getElementById('status').textContent=
      `Option C · ${rRows.length} seats · ${Object.keys(params).length} params · ${Object.keys(overrides).length} overrides · ${Object.keys(standing).length} standing rows`;
  } catch(e) {
    document.getElementById('loading').style.display='none';
    document.getElementById('error').style.display='block';
    document.getElementById('error').textContent='Error: '+e.message;
    console.error('iframe2:',e);
  }
}
init();
</script>
</body>
</html>
