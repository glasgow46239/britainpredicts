<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Britain Predicts — Create Your Own Forecast</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--con:#0087DC;--lab:#E4003B;--ldem:#FAA61A;--grn:#02A95B;--snp:#C8A400;--pc:#3F8428;--ref:#12B6CF;--oth:#57534e;--bg:#f8f7f4;--border:#e0dbd4;--text:#111;--muted:#666;}
body{font-family:'Roboto',sans-serif;background:var(--bg);margin:0;}
.masthead{background:#111;padding:14px 20px 12px;display:flex;align-items:baseline;gap:10px;}
.masthead-label{font-family:'Roboto Condensed',sans-serif;font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);}
.masthead-title{font-family:'Roboto Condensed',sans-serif;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;}
.masthead-sub{margin-left:auto;font-size:10px;color:rgba(255,255,255,.35);}
.body-wrap{display:grid;grid-template-columns:260px 1fr;gap:0;min-height:500px;}
.controls{background:#1a1a1a;padding:16px;}
.region-tabs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:14px;}
.rtab{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:2px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.45);cursor:pointer;transition:all .15s;}
.rtab:hover{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.35);}
.rtab.on{background:#fff;color:#111;border-color:#fff;}
.rtab.adj{border-color:var(--ref);color:var(--ref);}
.rtab.adj.on{background:var(--ref);color:#fff;border-color:var(--ref);}
.section-label{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:8px;}
.reg-note{font-size:9px;color:rgba(255,255,255,.3);margin-bottom:10px;line-height:1.5;display:flex;align-items:center;justify-content:space-between;}
.reset-btn{font-size:9px;padding:1px 6px;border-radius:2px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.4);cursor:pointer;}
.reset-btn:hover{color:#fff;border-color:rgba(255,255,255,.6);}
.party-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.party-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.party-name{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:11px;color:rgba(255,255,255,.8);width:42px;flex-shrink:0;}
.input-wrap{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.07);border-radius:3px;border:1px solid rgba(255,255,255,.12);overflow:hidden;transition:border-color .15s;}
.input-wrap:focus-within{border-color:rgba(255,255,255,.4);}
.party-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:13px;padding:4px 6px;text-align:right;width:0;-moz-appearance:textfield;}
.party-input::-webkit-outer-spin-button,.party-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.pct-label{font-size:10px;color:rgba(255,255,255,.35);padding:0 5px 0 2px;}
.nudge-col{display:flex;flex-direction:column;gap:1px;}
.nudge-btn{font-size:7px;line-height:1;width:14px;height:11px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15);border-radius:2px;background:transparent;color:rgba(255,255,255,.4);cursor:pointer;}
.nudge-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
.eff-note{font-size:9px;color:rgba(255,255,255,.25);margin:-4px 0 5px 57px;}
.eff-note .pos{color:#4ade80;}
.eff-note .neg{color:#f87171;}
.total-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
.total-label{font-size:11px;color:rgba(255,255,255,.5);}
.total-val{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:13px;color:#fff;}
.total-val.warn{color:#f87171;}
.total-val.ok{color:#4ade80;}
.norm-btn{font-size:9px;padding:2px 8px;border-radius:2px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.3);cursor:pointer;pointer-events:none;opacity:.4;}
.norm-btn.active{opacity:1;pointer-events:auto;color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.5);}
.thr-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.thr-label{font-size:10px;color:rgba(255,255,255,.4);flex:1;}
.thr-input{width:44px;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:12px;padding:3px 5px;border:1px solid rgba(255,255,255,.15);border-radius:3px;background:rgba(255,255,255,.07);color:#fff;text-align:right;-moz-appearance:textfield;}
.thr-input::-webkit-outer-spin-button,.thr-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.thr-pct{font-size:10px;color:rgba(255,255,255,.35);}
.run-btn{width:100%;padding:11px;font-family:'Roboto Condensed',sans-serif;font-weight:900;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:#fff;color:#111;border:none;cursor:pointer;border-radius:2px;transition:background .15s,transform .1s;}
.run-btn:hover{background:#e8e5e0;}
.run-btn:active{transform:scale(.98);}
.run-btn.running{background:#e8e5e0;color:#666;}
.results{background:var(--bg);padding:16px;display:flex;flex-direction:column;gap:12px;}
.results-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#aaa;text-align:center;padding:40px 20px;}
.placeholder-icon{font-size:28px;margin-bottom:4px;}
.placeholder-text{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#bbb;}
.placeholder-sub{font-size:11px;color:#ccc;}
.r-sbar{display:flex;height:5px;overflow:hidden;gap:1px;margin-bottom:3px;}
.r-ss{min-width:1px;}
.r-bar-labels{display:flex;justify-content:space-between;font-size:9px;color:#aaa;margin-bottom:10px;}
.r-call{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;color:#111;margin-bottom:4px;}
.r-scope{font-size:10px;color:#aaa;margin-bottom:12px;}
.r-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;}
.r-tile{position:relative;padding:12px 10px 10px;overflow:hidden;opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease,filter .15s;}
.r-tile.visible{opacity:1;transform:translateY(0);}
.r-tile:hover{filter:brightness(1.08);}
.r-tile-party{font-family:'Roboto Condensed',sans-serif;font-weight:900;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.8);margin-bottom:3px;}
.r-tile-seats{font-family:'Roboto Condensed',sans-serif;font-weight:900;font-size:36px;line-height:1;color:#fff;letter-spacing:-.02em;margin-bottom:3px;}
.r-tile-change{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:11px;color:rgba(255,255,255,.7);}
.r-tile-change.gain{color:rgba(255,255,255,.95);}
.r-tile-change.loss{color:rgba(255,255,255,.55);}
.r-tile-accent{position:absolute;right:-16px;bottom:-16px;width:56px;height:56px;background:rgba(255,255,255,.06);border-radius:50%;}
.divider{border:none;border-top:1px solid rgba(255,255,255,.08);margin:4px 0 10px;}
</style>
</head>
<body>
<div class="masthead">
  <span class="masthead-label">Britain Predicts</span>
  <span class="masthead-title">Create your own forecast</span>
  <span class="masthead-sub">Adjust vote shares · run the model</span>
</div>
<div class="body-wrap">
  <div class="controls">
    <div class="section-label" id="controls-label">National vote shares</div>
    <div class="region-tabs" id="rtabs"></div>
    <div id="reg-note-wrap"></div>
    <div id="pinputs"></div>
    <div class="total-row">
      <span class="total-label">Total</span>
      <span class="total-val" id="total-val">100.0%</span>
      <button class="norm-btn" id="norm-btn" onclick="normalise()">Normalise</button>
    </div>
    <hr class="divider">
    <div class="section-label">STM threshold</div>
    <div class="thr-row">
      <span class="thr-label">Min. local share to receive swing</span>
      <input class="thr-input" type="number" id="thr" min="5" max="35" step="1" value="20">
      <span class="thr-pct">%</span>
    </div>
    <button class="run-btn" id="run-btn" onclick="runModel()">Run forecast ↗</button>
  </div>
  <div class="results" id="results-panel">
    <div class="results-placeholder" id="placeholder">
      <div class="placeholder-icon">⟳</div>
      <div class="placeholder-text">Adjust the vote shares</div>
      <div class="placeholder-sub">Then hit Run forecast to see your projection</div>
    </div>
  </div>
</div>
<script>
const PC={con:'#0087DC',lab:'#E4003B',ldem:'#FAA61A',grn:'#02A95B',snp:'#C8A400',pc:'#3F8428',ref:'#12B6CF',oth:'#57534e'};
const PL={con:'Con',lab:'Lab',ldem:'LDem',grn:'Grn',snp:'SNP',pc:'PC',ref:'Reform',oth:'Oth'};
const MP=['con','lab','ldem','grn','snp','pc','ref','oth'];
const REGS=['National','Scotland','Wales','N. England','S. England','Midlands','London'];
const REG_KEYS=['GB-wide','Scotland','Wales','Northern England','Southern England','Midlands','London'];
const WM={'Con':'con','Lab':'lab','LDem':'ldem','LD':'ldem','Grn':'grn','Green':'grn','SNP':'snp','PC':'pc','Reform':'ref','Ref':'ref','Ind':'oth','Other':'oth','Oth':'oth','Alba':'oth','Speaker':'oth','SDLP':'oth','UUP':'oth','DUP':'oth','SF':'oth','Alliance':'oth','APNI':'oth','TUV':'oth','RSTR':'oth','Restore':'oth'};
const BN={con:23.7,lab:33.7,ldem:12.2,grn:6.7,snp:2.5,pc:0.7,ref:14.3,oth:6.2};
const BS={con:121,lab:412,ldem:72,grn:4,snp:9,pc:4,ref:5,oth:5};
const POLL_NAT={con:18.4,lab:18.3,ldem:12.2,grn:15.6,snp:0,pc:0,ref:26.4,oth:6.8};
const POLL_REG={Scotland:{con:10.3,lab:17.3,ldem:9.0,grn:7.9,snp:32.4,pc:0,ref:20.2,oth:2.9},Wales:{con:12.8,lab:18.7,ldem:7.3,grn:7.1,snp:0,pc:26.2,ref:26.9,oth:1.0},'Northern England':{con:14.5,lab:22.4,ldem:9.6,grn:18.2,snp:0,pc:0,ref:30.2,oth:5.1},'Southern England':{con:21.2,lab:13.8,ldem:19.4,grn:15.7,snp:0,pc:0,ref:25.7,oth:4.2},Midlands:{con:21.5,lab:18.4,ldem:9.0,grn:18.0,snp:0,pc:0,ref:28.1,oth:5.0},London:{con:18.7,lab:26.4,ldem:13.1,grn:22.9,snp:0,pc:0,ref:15.3,oth:3.6}};
const RESULTS_URL='https://raw.githubusercontent.com/glasgow46239/britainpredicts/main/results_2024.csv';
function initDeltas(){const d={};Object.keys(POLL_REG).forEach(r=>{d[r]={};MP.forEach(p=>{d[r][p]=(POLL_REG[r][p]||0)-(POLL_NAT[p]||0);});});return d;}
let national={...POLL_NAT},deltas=initDeltas(),cur='GB-wide',allSeats=[],useCustom=false;
function effShare(region,p){if(!POLL_REG[region])return national[p]||0;return Math.max(0,(national[p]||0)+((deltas[region]||{})[p]||0));}
function hasAdj(rkey){if(rkey==='GB-wide')return false;return MP.some(p=>Math.abs((deltas[rkey]||{})[p]||0)>0.05);}
function buildTabs(){const el=document.getElementById('rtabs');el.innerHTML='';REGS.forEach((label,i)=>{const rkey=REG_KEYS[i];const b=document.createElement('button');const adj=hasAdj(rkey);b.className='rtab'+(rkey===cur?' on':'')+(adj&&rkey!==cur?' adj':'');b.textContent=label;b.onclick=()=>{cur=rkey;buildTabs();renderInputs();};el.appendChild(b);});}
function getNatTotal(){return MP.reduce((s,p)=>s+(national[p]||0),0);}
function updateTotal(){const t=getNatTotal();const el=document.getElementById('total-val');const btn=document.getElementById('norm-btn');el.textContent=t.toFixed(1)+'%';const off=cur==='GB-wide'&&Math.abs(t-100)>0.5;el.className='total-val '+(off?'warn':'ok');btn.className='norm-btn'+(off?' active':'');}
function normalise(){const t=getNatTotal();if(!t)return;MP.forEach(p=>{national[p]=((national[p]||0)/t)*100;});renderInputs();}
function renderInputs(){const isNat=cur==='GB-wide';const lbl=document.getElementById('controls-label');lbl.textContent=isNat?'National vote shares':`${REGS[REG_KEYS.indexOf(cur)]} — adjustments (± vs national)`;const noteWrap=document.getElementById('reg-note-wrap');noteWrap.innerHTML=isNat?'':`<div class="reg-note"><span>Effective = national + adjustment</span><button class="reset-btn" onclick="resetReg()">Reset</button></div>`;const el=document.getElementById('pinputs');el.innerHTML='';MP.filter(p=>{if(p==='snp')return cur==='Scotland'||isNat;if(p==='pc')return cur==='Wales'||isNat;return true;}).forEach(p=>{const row=document.createElement('div');row.className='party-row';if(isNat){const v=(national[p]||0).toFixed(1);row.innerHTML=`<span class="party-dot" style="background:${PC[p]}"></span><span class="party-name">${PL[p]}</span><div class="input-wrap"><input class="party-input" type="number" min="0" max="100" step="0.1" value="${v}" id="pv-${p}" oninput="upNat(this,'${p}')"><span class="pct-label">%</span></div><div class="nudge-col"><button class="nudge-btn" onclick="nudgeNat('${p}',0.1)">▲</button><button class="nudge-btn" onclick="nudgeNat('${p}',-0.1)">▼</button></div>`;}else{const d=(deltas[cur]||{})[p]||0;const eff=Math.max(0,(national[p]||0)+d);const adjCls=d>0.05?'pos':d<-0.05?'neg':'';row.innerHTML=`<span class="party-dot" style="background:${PC[p]}"></span><span class="party-name">${PL[p]}</span><div class="input-wrap"><input class="party-input" type="number" min="-30" max="30" step="0.1" value="${d.toFixed(1)}" id="pv-${p}" oninput="upDelta(this,'${p}')"><span class="pct-label">%</span></div><div class="nudge-col"><button class="nudge-btn" onclick="nudgeDelta('${p}',0.1)">▲</button><button class="nudge-btn" onclick="nudgeDelta('${p}',-0.1)">▼</button></div>`;const effEl=document.createElement('div');effEl.className='eff-note';effEl.innerHTML=`Effective: <span class="${adjCls}">${eff.toFixed(1)}%</span>`;el.appendChild(row);el.appendChild(effEl);return;}el.appendChild(row);});updateTotal();}
function upNat(el,p){national[p]=Math.max(0,Math.min(100,parseFloat(el.value)||0));updateTotal();}
function nudgeNat(p,d){national[p]=Math.max(0,Math.min(100,(national[p]||0)+d));const el=document.getElementById('pv-'+p);if(el)el.value=national[p].toFixed(1);updateTotal();}
function upDelta(el,p){if(!deltas[cur])deltas[cur]={};deltas[cur][p]=Math.max(-30,Math.min(30,parseFloat(el.value)||0));const wrap=el.closest('.party-row');if(wrap&&wrap.nextElementSibling&&wrap.nextElementSibling.classList.contains('eff-note')){const eff=Math.max(0,(national[p]||0)+deltas[cur][p]);const span=wrap.nextElementSibling.querySelector('span');if(span){span.textContent=eff.toFixed(1)+'%';span.className=deltas[cur][p]>0.05?'pos':deltas[cur][p]<-0.05?'neg':'';}}buildTabs();}
function nudgeDelta(p,d){if(!deltas[cur])deltas[cur]={};deltas[cur][p]=Math.max(-30,Math.min(30,((deltas[cur]||{})[p]||0)+d));const el=document.getElementById('pv-'+p);if(el)el.value=deltas[cur][p].toFixed(1);upDelta(el,p);}
function resetReg(){if(cur==='GB-wide')return;deltas[cur]=initDeltas()[cur]||{};renderInputs();buildTabs();}
function parseCSV(t){const lines=t.trim().split('\n'),h=lines[0].split(',');return lines.slice(1).filter(l=>l.trim()).map(l=>{const c=l.split(','),o={};h.forEach((k,i)=>o[k.trim()]=(c[i]||'').trim());return o;});}
function inferTac(v){const s=MP.filter(p=>(v[p]||0)>0.03).sort((a,b)=>(v[b]||0)-(v[a]||0));const[f,sc]=s;if(!sc)return null;const pr=new Set([f,sc]);if(pr.has('lab')&&pr.has('ref'))return'lab_ref';if(pr.has('ldem')&&pr.has('con'))return'ldem_con';if(pr.has('grn')&&pr.has('lab'))return'grn_lab';return null;}
function stm(seat){const thr=(parseInt(document.getElementById('thr').value)||20)/100;const base=seat.votes,newN={},baseN={};MP.forEach(p=>{newN[p]=effShare(seat.region,p)/100;baseN[p]=(BN[p]||0)/100;});const sw={};MP.forEach(p=>{sw[p]=newN[p]-baseN[p];});const pr={};MP.forEach(p=>{const loc=base[p]||0,s=sw[p]||0;pr[p]=loc>=thr?Math.max(0,loc+s*Math.max(0,1-loc)*2):Math.max(0,loc*(1-Math.min(1,s<0?Math.abs(s)*2:0)));});const t=seat.tac;if(t==='lab_ref'){const ga=(pr.grn||0)*0.10,la=(pr.ldem||0)*0.08;pr.grn=Math.max(0,(pr.grn||0)-ga);pr.ldem=Math.max(0,(pr.ldem||0)-la);pr.lab=(pr.lab||0)+ga+la;}else if(t==='ldem_con'){const ga=(pr.grn||0)*0.12,la=(pr.lab||0)*0.15;pr.grn=Math.max(0,(pr.grn||0)-ga);pr.lab=Math.max(0,(pr.lab||0)-la);pr.ldem=(pr.ldem||0)+ga+la;}else if(t==='grn_lab'){const la=(pr.ldem||0)*0.10;pr.ldem=Math.max(0,(pr.ldem||0)-la);pr.grn=(pr.grn||0)+la;}const tot=Object.values(pr).reduce((a,b)=>a+b,0);if(tot>0)MP.forEach(p=>pr[p]=(pr[p]||0)/tot);const sorted=MP.slice().sort((a,b)=>(pr[b]||0)-(pr[a]||0));return{winner:sorted[0],runner:sorted[1],margin:((pr[sorted[0]]||0)-(pr[sorted[1]]||0))*100,shares:pr};}
async function loadSeats(){try{const r=await fetch(RESULTS_URL);if(r.ok){const t=await r.text();parseCSV(t).forEach(row=>{const region=(row['Region']||'').trim();if(!region||region==='Northern Ireland')return;const votes={};MP.forEach(p=>{votes[p]=p==='oth'?((parseFloat(row['oth_pct'])||0)+(parseFloat(row['rstr_pct'])||0)+(parseFloat(row['ind_pct'])||0))/100:(parseFloat(row[p+'_pct'])||0)/100;});allSeats.push({region,votes,tac:inferTac(votes),code:row['PCON24CD'],winner2024:WM[(row['Winner']||'').trim()]||'oth'});});}}catch(e){console.warn('Could not fetch results CSV:',e);}}
function runModel(){const btn=document.getElementById('run-btn');btn.classList.add('running');btn.textContent='Running…';btn.disabled=true;setTimeout(()=>{const counts={},results=[];MP.forEach(p=>counts[p]=0);allSeats.forEach(seat=>{const r=stm(seat);counts[r.winner]=(counts[r.winner]||0)+1;results.push({...r,seat});});renderResults(counts,results);try{window.parent.postMessage({action:'forecastUpdate',counts,seats:results.map(r=>({code:r.seat.code,winner:r.winner,margin:r.margin,shares:r.shares}))},'*');}catch(e){}btn.classList.remove('running');btn.textContent='Re-run forecast ↗';btn.disabled=false;},20);}
function renderResults(counts,results){const total=Object.values(counts).reduce((a,b)=>a+b,0),maj=Math.floor(total/2)+1,labS=counts.lab||0,conS=counts.con||0;let call=labS>=maj?`Labour majority of ${(labS-maj)*2+1}`:labS>=maj-30?`Labour short by ${maj-labS}`:`Hung parliament — largest: ${labS>=conS?'Lab':'Con'} (${Math.max(labS,conS)})`;const ord=['lab','con','ref','ldem','grn','snp','pc','oth'];const bar=ord.filter(p=>(counts[p]||0)>0).map(p=>`<div class="r-ss" style="width:${((counts[p]||0)/total*100).toFixed(2)}%;background:${PC[p]};"></div>`).join('');const tileOrder=['con','lab','ldem','ref','grn','snp','pc','oth'];const tiles=tileOrder.map(p=>{const s=counts[p]||0,base=BS[p]||0,diff=s-base,cls=diff>0?'gain':diff<0?'loss':'flat',arrow=diff>0?'▲':diff<0?'▼':'—';return`<div class="r-tile" style="background:${PC[p]};" id="rt-${p}"><div class="r-tile-party">${PL[p]}</div><div class="r-tile-seats">${s}</div><div class="r-tile-change ${cls}">${arrow} ${Math.abs(diff)} vs 2024</div><div class="r-tile-accent"></div></div>`;}).join('');const panel=document.getElementById('results-panel');panel.innerHTML=`<div class="r-sbar">${bar}</div><div class="r-bar-labels"><span>${total} GB seats</span><span>Majority: ${maj}</span></div><div class="r-call">${call}</div><div class="r-scope">GB only · NI projection coming soon · 18 seats not included</div><div class="r-grid">${tiles}</div>`;tileOrder.forEach((p,i)=>{setTimeout(()=>{const el=document.getElementById('rt-'+p);if(el)el.classList.add('visible');},50+i*50);});}
window.addEventListener('load',async()=>{await loadSeats();buildTabs();renderInputs();});
</script>
</body>
</html>
