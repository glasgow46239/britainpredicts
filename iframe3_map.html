<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Britain Predicts &mdash; Constituency Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--con:#0087DC;--lab:#E4003B;--ldem:#FAA61A;--grn:#02A95B;--snp:#C8A400;--pc:#3F8428;--ref:#12B6CF;--oth:#57534e;}
html,body{height:100%;margin:0;font-family:'Roboto',sans-serif;background:#f0ede8;}
.layout{display:flex;flex-direction:column;height:100vh;}
.masthead{background:#111;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:1000;position:relative;}
.masthead-label{font-family:'Roboto Condensed',sans-serif;font-weight:900;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);}
.masthead-title{font-family:'Roboto Condensed',sans-serif;font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#fff;}
.live-badge{margin-left:auto;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:rgba(18,182,207,.2);color:var(--ref);border:1px solid rgba(18,182,207,.4);}
.main{display:flex;flex:1;overflow:hidden;}
#map{flex:1;z-index:1;}
.side-panel{width:280px;flex-shrink:0;background:#fff;border-left:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden;z-index:500;}
.panel-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ccc;text-align:center;padding:24px;gap:8px;}
.pp-icon{font-size:24px;}
.pp-text{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#bbb;}
.pp-sub{font-size:10px;color:#ccc;}
.panel-header{padding:10px 14px 9px;flex-shrink:0;background:#f8f7f4;border-bottom:1px solid #eee;}
.panel-hold-label{font-family:'Roboto Condensed',sans-serif;font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;display:inline-block;padding:3px 10px 3px 8px;border-radius:2px;margin-bottom:8px;}
.panel-name{font-size:16px;font-weight:700;color:#111;line-height:1.2;margin-bottom:2px;}
.panel-region{font-size:11px;color:#888;}
.rvp-label{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#aaa;margin:10px 14px 5px;}
.rvp-bar{height:10px;display:flex;margin:0 14px 2px;border-radius:2px;overflow:hidden;gap:1px;}
.rvp-seg{min-width:1px;}
.rvp-sub{font-size:9px;color:#bbb;margin:0 14px 8px;}
.party-table{flex:1;overflow-y:auto;padding:0 14px 14px;}
table{width:100%;border-collapse:collapse;}
th{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#aaa;padding:5px 4px 5px 0;border-bottom:1px solid #eee;text-align:left;}
th.num{text-align:right;}
td{font-size:11px;padding:5px 4px 5px 0;border-bottom:1px solid #f5f5f5;vertical-align:middle;}
td.num{text-align:right;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:12px;}
td.chg{text-align:right;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:11px;}
td.chg.pos{color:#16a34a;}
td.chg.neg{color:#dc2626;}
td.chg.zero{color:#aaa;}
.party-swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;flex-shrink:0;}
.party-cell{display:flex;align-items:center;}
.ni-note{font-size:9px;color:#aaa;text-align:center;padding:8px 14px;border-top:1px solid #eee;flex-shrink:0;}
#map-loading{position:absolute;top:0;left:0;right:280px;bottom:0;background:#f0ede8;display:flex;align-items:center;justify-content:center;z-index:2000;flex-direction:column;gap:8px;}
.map-dots{display:flex;gap:5px;}
.map-dots span{width:5px;height:5px;border-radius:50%;background:#999;animation:blink 1.2s infinite;opacity:.3;}
.map-dots span:nth-child(2){animation-delay:.2s;}
.map-dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.map-loading-txt{font-size:11px;color:#999;}
.leaflet-container{background:#f0ede8 !important;}
.leaflet-control-zoom{border:none !important;box-shadow:0 2px 8px rgba(0,0,0,.15) !important;}
.leaflet-control-zoom a{background:#fff !important;color:#333 !important;font-weight:700;border:none !important;border-bottom:1px solid #eee !important;}
.leaflet-control-zoom a:last-child{border-bottom:none !important;}
</style>
</head>
<body>
<div class="layout">
  <div class="masthead">
    <span class="masthead-label">Britain Predicts</span>
    <span class="masthead-title">Constituency Map</span>
    <span class="live-badge" id="live-badge" style="display:none;">&#9679; Live</span>
  </div>
  <div class="main">
    <div id="map">
      <div id="map-loading">
        <div class="map-dots"><span></span><span></span><span></span></div>
        <div class="map-loading-txt" id="map-loading-txt">Loading map&hellip;</div>
      </div>
    </div>
    <div class="side-panel" id="side-panel">
      <div class="panel-placeholder">
        <div class="pp-icon">&#128506;</div>
        <div class="pp-text">Hover over a constituency</div>
        <div class="pp-sub">to see the projected result</div>
      </div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PC={con:'#0087DC',lab:'#E4003B',ldem:'#FAA61A',grn:'#02A95B',snp:'#C8A400',pc:'#3F8428',ref:'#12B6CF',oth:'#57534e'};
const PL={con:'Conservative',lab:'Labour',ldem:'Lib Dem',grn:'Green',snp:'SNP',pc:'Plaid Cymru',ref:'Reform',oth:'Other'};
const PS={con:'Con',lab:'Lab',ldem:'LDem',grn:'Grn',snp:'SNP',pc:'PC',ref:'Reform',oth:'Oth'};
const MP=['con','lab','ldem','grn','snp','pc','ref','oth'];
const BAR_ORDER=['grn','lab','snp','pc','ldem','oth','con','ref'];
const NI_CODES=new Set(['N06000001','N06000002','N06000003','N06000004','N06000005','N06000006','N06000007','N06000008','N06000009','N06000010','N06000011','N06000012']);
const WM={'Con':'con','Lab':'lab','LDem':'ldem','LD':'ldem','Grn':'grn','Green':'grn','SNP':'snp','PC':'pc','Reform':'ref','Ref':'ref','Ind':'oth','Other':'oth','Oth':'oth','Alba':'oth','Speaker':'oth','SDLP':'oth','UUP':'oth','DUP':'oth','SF':'oth','Alliance':'oth','APNI':'oth','TUV':'oth','RSTR':'oth','Restore':'oth'};
const BN={con:23.7,lab:33.7,ldem:12.2,grn:6.7,snp:2.5,pc:0.7,ref:14.3,oth:6.2};
const POLL_NAT={con:18.4,lab:18.3,ldem:12.2,grn:15.6,snp:0,pc:0,ref:26.4,oth:6.8};
const POLL_REG={Scotland:{con:10.3,lab:17.3,ldem:9.0,grn:7.9,snp:32.4,pc:0,ref:20.2,oth:2.9},Wales:{con:12.8,lab:18.7,ldem:7.3,grn:7.1,snp:0,pc:26.2,ref:26.9,oth:1.0},'Northern England':{con:14.5,lab:22.4,ldem:9.6,grn:18.2,snp:0,pc:0,ref:30.2,oth:5.1},'Southern England':{con:21.2,lab:13.8,ldem:19.4,grn:15.7,snp:0,pc:0,ref:25.7,oth:4.2},Midlands:{con:21.5,lab:18.4,ldem:9.0,grn:18.0,snp:0,pc:0,ref:28.1,oth:5.0},London:{con:18.7,lab:26.4,ldem:13.1,grn:22.9,snp:0,pc:0,ref:15.3,oth:3.6}};
const GEO_URL='https://raw.githubusercontent.com/glasgow46239/britainpredicts/main/parlcons_westmisnter.json';
const RESULTS_URL='https://raw.githubusercontent.com/glasgow46239/britainpredicts/main/results_2024.csv';
function initDeltas(){const d={};Object.keys(POLL_REG).forEach(r=>{d[r]={};MP.forEach(p=>{d[r][p]=(POLL_REG[r][p]||0)-(POLL_NAT[p]||0);});});return d;}
const national={...POLL_NAT},deltas=initDeltas();
function effShare(r,p){if(!POLL_REG[r])return national[p]||0;return Math.max(0,(national[p]||0)+((deltas[r]||{})[p]||0));}
let seatByCode={},resultsByCode={},geoLayer=null,leafMap=null,activeLayer=null;
function parseCSVRow(l){const r=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){q=!q;}else if(ch===','&&!q){r.push(c.trim());c='';}else{c+=ch;}}r.push(c.trim());return r;}
function parseCSV(t){const lines=t.trim().split('\n'),h=parseCSVRow(lines[0]);return lines.slice(1).filter(l=>l.trim()).map(l=>{const c=parseCSVRow(l),o={};h.forEach((k,i)=>o[k.trim()]=(c[i]||'').trim());return o;});}
function inferTac(v){const s=MP.filter(p=>(v[p]||0)>0.03).sort((a,b)=>(v[b]||0)-(v[a]||0));const[f,sc]=s;if(!sc)return null;const pr=new Set([f,sc]);if(pr.has('lab')&&pr.has('ref'))return'lab_ref';if(pr.has('ldem')&&pr.has('con'))return'ldem_con';if(pr.has('grn')&&pr.has('lab'))return'grn_lab';return null;}
function stm(seat){const thr=0.20,base=seat.votes,newN={},baseN={};MP.forEach(p=>{newN[p]=effShare(seat.region,p)/100;baseN[p]=(BN[p]||0)/100;});const sw={};MP.forEach(p=>{sw[p]=newN[p]-baseN[p];});const pr={};MP.forEach(p=>{const loc=base[p]||0,s=sw[p]||0;pr[p]=loc>=thr?Math.max(0,loc+s*Math.max(0,1-loc)*2):Math.max(0,loc*(1-Math.min(1,s<0?Math.abs(s)*2:0)));});const t=seat.tac;if(t==='lab_ref'){const ga=(pr.grn||0)*.10,la=(pr.ldem||0)*.08;pr.grn=Math.max(0,(pr.grn||0)-ga);pr.ldem=Math.max(0,(pr.ldem||0)-la);pr.lab=(pr.lab||0)+ga+la;}else if(t==='ldem_con'){const ga=(pr.grn||0)*.12,la=(pr.lab||0)*.15;pr.grn=Math.max(0,(pr.grn||0)-ga);pr.lab=Math.max(0,(pr.lab||0)-la);pr.ldem=(pr.ldem||0)+ga+la;}else if(t==='grn_lab'){const la=(pr.ldem||0)*.10;pr.ldem=Math.max(0,(pr.ldem||0)-la);pr.grn=(pr.grn||0)+la;}const tot=Object.values(pr).reduce((a,b)=>a+b,0);if(tot>0)MP.forEach(p=>pr[p]=(pr[p]||0)/tot);const sorted=MP.slice().sort((a,b)=>(pr[b]||0)-(pr[a]||0));return{winner:sorted[0],runner:sorted[1],margin:((pr[sorted[0]]||0)-(pr[sorted[1]]||0))*100,shares:pr};}
async function loadData(){try{const r=await fetch(RESULTS_URL);if(r.ok){const t=await r.text();parseCSV(t).forEach(row=>{const code=row['PCON24CD'],region=(row['Region']||'').trim();if(!code||region==='Northern Ireland')return;const votes={};MP.forEach(p=>{votes[p]=p==='oth'?((parseFloat(row['oth_pct'])||0)+(parseFloat(row['rstr_pct'])||0)+(parseFloat(row['ind_pct'])||0))/100:(parseFloat(row[p+'_pct'])||0)/100;});const defender=WM[(row['Winner']||'').trim()]||'oth';seatByCode[code]={code,name:row['Constituency name'],region,defender,votes,tac:inferTac(votes)};});}}catch(e){console.warn('Results fetch failed',e);}
Object.values(seatByCode).forEach(seat=>{const r=stm(seat);resultsByCode[seat.code]={winner:r.winner,runner:r.runner,margin:r.margin,shares:r.shares,defender:seat.defender};});}
function initMap(){leafMap=L.map('map',{zoomControl:true,attributionControl:true}).setView([54.5,-3.5],6);L.tileLayer('https://{s}.tile.openfreemap.org/planet/{z}/{x}/{y}.png',{attribution:'Map data \u00a9 <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors \u00b7 Tiles by <a href="https://openfreemap.org">OpenFreeMap</a> \u00b7 Britain Predicts',maxZoom:18}).addTo(leafMap);}
function styleFeature(feature){const code=feature.properties.PCON24CD;if(NI_CODES.has(code))return{fillColor:'#d1d5db',fillOpacity:0.5,color:'#aaa',weight:0.5};const res=resultsByCode[code];if(!res)return{fillColor:'#e5e7eb',fillOpacity:0.6,color:'#fff',weight:0.5};return{fillColor:PC[res.winner]||'#ccc',fillOpacity:0.65,color:'rgba(255,255,255,0.8)',weight:0.5};}
function onFeatureHover(e){const layer=e.target,code=layer.feature.properties.PCON24CD;if(NI_CODES.has(code))return;layer.setStyle({fillOpacity:0.9,color:'#111',weight:2});layer.bringToFront();showPanel(code,layer);}
function onFeatureOut(e){const layer=e.target;if(layer===activeLayer)return;geoLayer.resetStyle(layer);}
function onFeatureClick(e){const layer=e.target,code=layer.feature.properties.PCON24CD;if(NI_CODES.has(code))return;if(activeLayer&&activeLayer!==layer)geoLayer.resetStyle(activeLayer);activeLayer=layer;layer.setStyle({fillOpacity:0.95,color:'#111',weight:2.5});layer.bringToFront();showPanel(code,layer);}
function showPanel(code,layer){const seat=seatByCode[code],res=resultsByCode[code];if(!seat||!res)return;const name=layer.feature.properties.PCON24NM||seat.name,changed=res.winner!==res.defender,holdGain=changed?(PS[res.winner].toUpperCase()+' GAIN FROM '+PS[res.defender].toUpperCase()):(PS[res.winner].toUpperCase()+' HOLD'),winCol=PC[res.winner]||'#ccc';const sorted=MP.filter(p=>(res.shares[p]||0)>0.005||(seat.votes[p]||0)>0.005).sort((a,b)=>(res.shares[b]||0)-(res.shares[a]||0));const rvpBar=BAR_ORDER.filter(p=>(res.shares[p]||0)>0.005).map(p=>'<div class="rvp-seg" style="flex:'+((res.shares[p]||0)*100).toFixed(2)+';background:'+PC[p]+';"></div>').join('');const rows=sorted.slice(0,6).map(p=>{const proj=(res.shares[p]||0)*100,base=(seat.votes[p]||0)*100,chg=proj-base,chgCls=chg>0.15?'pos':chg<-0.15?'neg':'zero',chgStr=chg>0.15?'+'+chg.toFixed(1):chg<-0.15?chg.toFixed(1):'\u2014';return'<tr><td><div class="party-cell"><span class="party-swatch" style="background:'+PC[p]+';"></span>'+PL[p]+'</div></td><td class="num">'+proj.toFixed(1)+'</td><td class="chg '+chgCls+'">'+chgStr+'</td></tr>';}).join('');document.getElementById('side-panel').innerHTML='<div class="panel-header"><div class="panel-hold-label" style="background:'+winCol+';">'+holdGain+'</div><div class="panel-name">'+name+'</div><div class="panel-region">'+seat.region+'</div></div><div class="rvp-label">Result vs. 2024</div><div class="rvp-bar">'+rvpBar+'</div><div class="rvp-sub">Projected \u00b7 margin: '+res.margin.toFixed(1)+'pts</div><div class="party-table"><table><thead><tr><th>Party</th><th class="num">Pct</th><th class="num">Chg</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="ni-note">GB only \u00b7 NI projection coming soon</div>';}
function updateMapColors(){if(!geoLayer)return;geoLayer.setStyle(styleFeature);}
async function loadGeo(){document.getElementById('map-loading-txt').textContent='Fetching constituency boundaries\u2026';const proxies=[u=>u,u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?'+encodeURIComponent(u)];let geo=null;for(const proxy of proxies){try{const r=await fetch(proxy(GEO_URL),{signal:AbortSignal.timeout(20000)});if(r.ok){const t=await r.text();if(t.length>1000){geo=JSON.parse(t);break;}}}catch(e){}}if(!geo){document.getElementById('map-loading').innerHTML='<div class="map-loading-txt" style="font-size:10px;color:#aaa;max-width:240px;text-align:center;">Map loads when hosted on GitHub Pages.</div>';return;}document.getElementById('map-loading').style.display='none';geoLayer=L.geoJSON(geo,{style:styleFeature,onEachFeature:(feature,layer)=>{const code=feature.properties.PCON24CD;if(!NI_CODES.has(code)){layer.on({mouseover:onFeatureHover,mouseout:onFeatureOut,click:onFeatureClick});}}}).addTo(leafMap);}
window.addEventListener('message',e=>{if(e.data&&e.data.action==='forecastUpdate'&&e.data.seats){e.data.seats.forEach(s=>{if(resultsByCode[s.code]){resultsByCode[s.code]={...resultsByCode[s.code],winner:s.winner,margin:s.margin,shares:s.shares};}});updateMapColors();document.getElementById('live-badge').style.display='';}});
(async()=>{await loadData();initMap();await loadGeo();})();
</script>
</body>
</html>
