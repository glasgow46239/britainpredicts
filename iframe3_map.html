<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Britain Predicts — Constituency Map</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#f5f5f5;margin:0;}

/* ── Control bar ── */
#control-bar{display:flex;flex-direction:column;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid #ddd;}
#control-row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
#control-row2{display:flex;align-items:center;gap:8px;padding-left:2px;}
@media(max-width:480px){#control-row1{gap:8px;}#view-controls{width:100%;}#search-wrap{max-width:100%;}}
#search-wrap{flex:1;min-width:160px;max-width:320px;position:relative;}
#search-input{width:100%;padding:7px 14px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;background:#fff;outline:none;color:#222;}
#search-input:focus{border-color:#aaa;box-shadow:0 0 0 2px rgba(0,0,0,.06);}
#search-input::placeholder{color:#bbb;}
#search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #e5e5e5;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;display:none;z-index:100;}
#search-results.open{display:block;}
.search-result-item{padding:9px 14px;cursor:pointer;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:9px;}
.search-result-item:last-child{border-bottom:none;}
.search-result-item:hover{background:#f8f8f7;}
.search-result-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.search-result-text{flex:1;min-width:0;}
.search-result-ward{font-size:13px;font-weight:500;color:#111;}
.search-result-council{font-size:11px;color:#888;}
.search-no-results{padding:12px 14px;font-size:12px;color:#aaa;text-align:center;}

/* ── View controls ── */
#view-controls{display:flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;flex-shrink:0;}
.vc-label{color:#999;font-size:10px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;}
.vc-seg{display:flex;border:1px solid #e0e0e0;border-radius:12px;overflow:hidden;}
.vc-btn{padding:3px 10px;font-size:11px;font-family:inherit;border:none;background:transparent;cursor:pointer;color:#555;transition:background .15s,color .15s;}
.vc-btn:hover{background:#f5f5f5;}
.vc-btn.active{background:#222;color:#fff;}
#party-select-wrap{display:none;align-items:center;gap:6px;}
#party-select-wrap.visible{display:flex;}
#party-select{border:1px solid #e0e0e0;border-radius:12px;padding:3px 8px;font-size:11px;font-family:inherit;background:#fff;color:#333;cursor:pointer;outline:none;}
#flip-controls{display:flex;align-items:center;gap:6px;}
#flip-controls.hidden{display:none;}

/* ── Map container ── */
#map-container{position:relative;width:100%;height:720px;}
#map{position:absolute;top:0;left:0;right:0;bottom:0;}

/* Flip legend */
#flip-legend{position:absolute;left:10px;bottom:10px;z-index:15;background:rgba(255,255,255,.94);border:1px solid #ddd;border-radius:8px;padding:8px 10px;box-shadow:0 1px 5px rgba(0,0,0,.1);font-size:10px;color:#666;display:none;}
#flip-legend.visible{display:block;}
#flip-legend-title{font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#888;margin-bottom:6px;font-size:9px;}
.fl-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.fl-row:last-child{margin-bottom:0;}
.fl-swatch{width:16px;height:16px;border-radius:3px;background:#888;flex-shrink:0;}
.fl-held{opacity:.35;border:1px solid #bbb;}
.fl-flip{border:3px solid #111;}

/* ── Side panel ── */
/* A floating card over the map (like the legends/pin-indicator below), not
   a docked column — it only ever occupies its own content height, so the
   map keeps full width and isn't permanently notched for an empty column. */
#side-panel{position:absolute;top:10px;right:10px;width:280px;max-height:calc(100% - 20px);background:#fff;border:5px solid #fff;border-radius:0px;box-shadow:0 2px 14px rgba(0,0,0,.16);display:flex;flex-direction:column;overflow:hidden;z-index:16;visibility:hidden;opacity:0;transition:opacity .12s ease,visibility .12s ease;}
#side-panel.is-visible{visibility:visible;opacity:1;}

/* Result bar */
.result-bar{display:flex;align-items:stretch;height:32px;flex-shrink:0;}
.result-bar-incumbent{width:10px;flex-shrink:0;}
.result-bar-fill{flex:1;display:flex;align-items:center;padding:0 10px;}
.result-bar-text{font-size:11px;font-weight:600;text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Panel header */
.panel-header{padding:10px 10px 8px;border-bottom:1px solid #f0f0f0;flex-shrink:0;}
.con-name{font-size:14px;font-weight:600;color:#111;line-height:1.2;}
.con-region{font-size:12px;color:#777;margin-top:3px;}
.panel-body{padding:10px;overflow-y:auto;flex:1;}

/* Stacked bars */
.stacked-section{margin-bottom:12px;}
.stacked-label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.stacked-bar{display:flex;width:100%;height:15px;overflow:hidden;margin-bottom:2px;}
.stacked-bar.previous{height:5px;opacity:1;margin-bottom:0;}

/* Results table */
.results-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
.results-table thead th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#aaa;font-weight:400;padding:0 3px 7px;}
.results-table thead th:first-child{text-align:left;width:95px;padding-left:0;}
.results-table thead th:nth-child(2){text-align:right;width:38px;}
.results-table thead th:nth-child(4){text-align:right;width:44px;}
.results-table tbody tr{border-top:1px solid #f5f5f5;}
.results-table tbody td{padding:0 3px;vertical-align:middle;}
.party-cell{display:flex;align-items:center;}
.party-stripe{width:3px;height:21px;flex-shrink:0;}
.party-name{font-size:12px;font-weight:400;color:#111;padding-left:8px;}
.pct-cell{text-align:right;font-size:12px;font-weight:400;color:#111;font-variant-numeric:tabular-nums;}
.bar-cell{padding:0 4px;}
.bar-track{height:15px;background:#f0f0f0;overflow:hidden;}
.bar-fill{height:100%;}
.chg-cell{text-align:right;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.chg-pos{color:#059669;}
.chg-neg{color:#DC2626;}
.chg-nil{color:#bbb;}

/* ── Pin indicator ── */
#pin-indicator{position:absolute;top:10px;left:50px;z-index:15;background:rgba(255,255,255,.94);border:1px solid #ddd;border-radius:20px;padding:5px 12px 5px 8px;font-size:11px;color:#333;display:none;align-items:center;gap:7px;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.1);user-select:none;}
#pin-indicator.active{display:flex;}
#pin-indicator:hover{background:#f0f0f0;}

/* ── Choropleth legend ── */
#choropleth-legend{position:absolute;bottom:10px;left:10px;z-index:15;background:rgba(255,255,255,.94);border:1px solid #ddd;border-radius:8px;padding:8px 12px;box-shadow:0 1px 5px rgba(0,0,0,.1);display:none;flex-direction:column;gap:4px;min-width:140px;}
#choropleth-legend.visible{display:flex;}
#legend-title{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:2px;}
#legend-bins{display:none;flex-direction:column;gap:4px;}
#legend-bins.visible{display:flex;}
#legend-bins-row{display:flex;gap:2px;}
#legend-bins-row .bin{width:18px;height:10px;border-radius:2px;}
#legend-bins-labels{display:flex;justify-content:space-between;font-size:9px;color:#666;}

/* ── Mobile drawer ── */
#drawer{position:absolute;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid #e5e5e5;transform:translateY(100%);transition:transform .3s ease;display:none;}
#drawer.drawer-enabled{display:block;}
#drawer-handle{display:flex;flex-direction:column;align-items:center;padding:10px 0;cursor:pointer;gap:5px;}
#drawer-pip{width:36px;height:4px;border-radius:2px;background:#ddd;}
#drawer-peek{display:flex;align-items:stretch;height:55px;overflow:hidden;margin-bottom:6px;}
#drawer-toggle{flex-shrink:0;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:3px 10px;cursor:pointer;background:rgba(0,0,0,.15);white-space:nowrap;}
#drawer-toggle:hover{background:rgba(0,0,0,.25);}
#drawer-body{padding:0 16px 24px;overflow-y:auto;max-height:55vh;display:none;}

/* ── Attribution ── */
.map-credit{font-size:11px;color:#aaa;text-align:center;padding:6px 0 10px;}
.map-credit a{color:#aaa;}
</style>
</head>
<body>
<div id="control-bar">
  <div id="control-row1">
    <div id="search-wrap">
      <input id="search-input" type="search" placeholder="Search constituency…" autocomplete="off">
      <div id="search-results" role="listbox"></div>
    </div>
    <div id="view-controls">
      <span class="vc-label">View</span>
      <div class="vc-seg">
        <button class="vc-btn active" data-mode="winner">Winner</button>

      <span class="vc-label">Highlight seats which changed hands</span>

</div>

<div id="map-container">

  <div id="side-panel">

        <div class="result-bar-incumbent" id="result-bar-incumbent"></div>
        <div class="result-bar-fill" id="result-bar-fill">
          <span class="result-bar-text" id="result-bar-text"></span>
        </div>
      </div>

  </div>

  <div id="choropleth-legend">
    <div id="legend-title">Vote share</div>

    <div id="flip-legend-title">Seat status</div>

  <div id="pin-indicator" role="button" title="Click to unpin">
    <span id="pin-dot" style="width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;"></span>

    <span style="color:#bbb;">&#10005;</span>

  <div id="drawer">
    <div id="drawer-handle" role="button">
      <div id="drawer-pip"></div>
    </div>
    <div id="drawer-peek">
      <div id="drawer-peek-incumbent" style="width:8px;flex-shrink:0;align-self:stretch;"></div>
      <div id="drawer-peek-fill" style="flex:1;display:flex;align-items:center;padding:0 10px;gap:8px;min-width:0;">
        <div style="flex:1;min-width:0;">
          <div id="drawer-peek-label" style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#fff;line-height:1;margin-bottom:3px;"></div>
          <div id="drawer-peek-name" style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
        </div>
        <button id="drawer-toggle">Details &#8593;</button>

    <div id="drawer-body"></div>

</div>

<p class="map-credit">Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors &middot; Tiles by <a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &middot; Britain Predicts</p>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ============================================================
// PARTY DEFINITIONS
// Lowercase keys to match STM model output
// ============================================================
const PARTIES = {
  grn:  { label:'Green',        short:'Grn',    color:'#5CBC4A' },
  lab:  { label:'Labour',       short:'Lab',    color:'#D34C4C' },
  snp:  { label:'SNP',          short:'SNP',    color:'#EEE03C' },
  pc:   { label:'Plaid Cymru',  short:'PC',     color:'#469366' },
  ldem: { label:'Lib Dem',      short:'LDem',   color:'#ebb82f' },
  oth:  { label:'Other',        short:'Oth',    color:'#CCA7C6' },
  con:  { label:'Conservative', short:'Con',    color:'#05718F' },
  ref:  { label:'Reform',       short:'Reform', color:'#15B6C2' },
};

// Display order for stacked bars
const BAR_ORDER = ['grn','lab','snp','pc','ldem','oth','con','ref'];

// Choropleth ceilings
const CHOROPLETH_CEILINGS = { grn:50, lab:65, snp:60, pc:60, ldem:50, oth:30, con:65, ref:55 };

// ============================================================
// ============================================================
// CONFIG
// ============================================================
const BASE        = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=';
const POLL_CSV    = BASE + '0&single=true&output=csv';
const PARAMS_URL  = BASE + '1932049493&single=true&output=csv';
const OVERRIDE_URL= BASE + '322317408&single=true&output=csv';
const STANDING_URL= BASE + '804182419&single=true&output=csv';
const RESULTS_URL = 'https://raw.githubusercontent.com/glasgow46239/britainpredicts/main/results_2024.csv';
const GEO_URL     = 'https://raw.githubusercontent.com/glasgow46239/britainpredicts/main/parlcons_westmisnter.json';

const NI_CODES = new Set(['N06000001','N06000002','N06000003','N06000004','N06000005','N06000006','N06000007','N06000008','N06000009','N06000010','N06000011','N06000012']);
const WM = {Con:'con',Lab:'lab',LDem:'ldem',LD:'ldem',Grn:'grn',Green:'grn',SNP:'snp',PC:'pc',Reform:'ref',Ref:'ref',Ind:'oth',Other:'oth',Oth:'oth',Alba:'oth',Speaker:'oth',SDLP:'oth',UUP:'oth',DUP:'oth',SF:'oth',Alliance:'oth',APNI:'oth',TUV:'oth',RSTR:'oth'};
const MP    = ['con','lab','ldem','grn','snp','pc','ref','oth'];
const FRESH = {con:12,lab:10,ldem:8,grn:5,snp:18,pc:12,ref:16,oth:3};

const BASELINE_2024 = {
  'GB-wide':         {con:23.7,lab:33.7,ldem:12.2,grn:6.4, snp:2.5, pc:0.7, ref:14.3,oth:6.2},
  'Scotland':        {con:12.7,lab:35.3,ldem:9.7, grn:3.8, snp:30.0,pc:0,   ref:7.0, oth:1.5},
  'Wales':           {con:18.2,lab:37.0,ldem:6.5, grn:4.7, snp:0,   pc:14.8,ref:16.9,oth:1.9},
  'Northern England':{con:19.6,lab:43.6,ldem:6.9, grn:7.2, snp:0,   pc:0,   ref:17.4,oth:5.3},
  'Southern England':{con:29.7,lab:26.5,ldem:19.4,grn:7.1, snp:0,   pc:0,   ref:15.1,oth:2.1},
  'Midlands':        {con:27.7,lab:35.2,ldem:7.3, grn:6.4, snp:0,   pc:0,   ref:18.6,oth:4.8},
  'London':          {con:20.6,lab:43.0,ldem:11.0,grn:10.0,snp:0,   pc:0,   ref:8.7, oth:6.7},
};

// ============================================================
// TACTICAL VOTING CONFIG
// ============================================================
// Three optional sheet tabs, same spreadsheet as everything else. All are
// optional — leave a URL null and the model runs on the defaults below.
//
//   "Tactical Party Positions" — columns: party,econ,temper,willingness,abstain
//                           Where each party sits on two axes (econ: -1 left
//                           .. +1 right; temper: 0 establishment .. 1 populist/
//                           insurgent), how tactically-minded its voters are
//                           overall (willingness, 0-1), and what share of any
//                           leaked vote just doesn't turn out rather than
//                           transferring (abstain, 0-1). This is the primary
//                           engine — affinity between any two parties in a
//                           given seat is DERIVED from these positions plus
//                           who's actually leading, so it varies by context
//                           automatically (a moderate Con voter's willingness
//                           to lend to Labour rises specifically in seats
//                           where Reform, not Labour, is the frontrunner).
//   "Tactical Affinity"  — columns: from,con,lab,ldem,grn,snp,pc,ref,oth
//                           Manual override on top of the computed positions.
//                           Leave a cell blank to let the compass model decide
//                           that pair; fill one in (0-100%) to hard-set it.
//   "Tactical Intensity" — columns: PCON24CD,intensity
//                           per-seat multiplier on the squeeze strength,
//                           default 1 if the seat has no row. Use this for
//                           seats with an unusually hot local campaign.
const POSITIONS_URL = BASE + '2070464065&single=true&output=csv';
const AFFINITY_URL  = BASE + '789919651&single=true&output=csv';
const INTENSITY_URL = BASE + '1557796036&single=true&output=csv';

// Seed party positions — used until POSITIONS_URL is set, and as the
// fallback for any party missing a row in that sheet.
const DEFAULT_POSITIONS = {
  con:  { econ: 0.6,  temper: 0.2,  willingness: 0.45, abstain: 0.35 },
  ref:  { econ: 0.5,  temper: 0.9,  willingness: 0.25, abstain: 0.10 },
  lab:  { econ: -0.5, temper: 0.15, willingness: 0.40, abstain: 0.20 },
  ldem: { econ: -0.2, temper: 0.15, willingness: 0.70, abstain: 0.10 },
  grn:  { econ: -0.8, temper: 0.35, willingness: 0.75, abstain: 0.10 },
  snp:  { econ: -0.4, temper: 0.30, willingness: 0.30, abstain: 0.15 },
  pc:   { econ: -0.4, temper: 0.30, willingness: 0.30, abstain: 0.15 },
  oth:  { econ: 0,    temper: 0.5,  willingness: 0.20, abstain: 0.30 },
};

// Manual affinity overrides (fractions 0-1) — sparse by design. Only pairs
// listed here skip the compass calculation; everything else is derived.
const DEFAULT_AFFINITY = {};

// Squeeze shape.
const D_SCALE               = 1.0;  // compass-distance normaliser
const PROTEST_FLOOR         = 0.12; // small "anyone but them" weight even for ideologically distant allies
const CLOSENESS_SCALE       = 0.30; // squeeze fades to 0 once the leader is >30pts clear of the strongest trailing party
const MAX_SQUEEZE_FRACTION  = 0.65; // hard ceiling: no donor party ever loses more than 65% of its vote tactically

// ============================================================
// STATE
// ============================================================
let PARAMS    = {};
let OVERRIDES = {};
let STANDING  = {};
let POLL_MAP  = {};
let DATA      = {};
let POSITIONS      = DEFAULT_POSITIONS;
let AFFINITY       = DEFAULT_AFFINITY;
let SEAT_INTENSITY = {};   // PCON24CD -> multiplier, from Tactical Intensity tab
let TACTICAL_ENABLED = true;
let GLOBAL_INTENSITY = 1;  // scenario slider from iframe2, default 1x
// True once iframe2 has actually run a forecast with figures that differ
// from the live Poll Tracker (iframe2 computes this precisely and sends it
// on forecastUpdate) — threaded through into the seatCounts broadcast below
// so iframe1's header can show "Your forecast" vs "The Britain Elects
// forecast" without needing its own copy of the comparison logic.
let IS_USER_PROJECTION = false;

// ============================================================
// CSV PARSER
// ============================================================
function parseCSVLine(line) {
  const Q = '\x22'; // double-quote character — avoids HTML parser conflict
  const f = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === Q && line[i+1] === Q) { cur += Q; i++; }
      else if (ch === Q) { inQ = false; }
      else { cur += ch; }
    } else {
      if (ch === Q) { inQ = true; }
      else if (ch === ',') { f.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
  }
  f.push(cur.trim());
  return f;
}

function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (!lines.length) return [];
  const sep = lines[0].includes('\t') ? '\t' : ',';
  if (sep === ',') {
    const h = parseCSVLine(lines[0]);
    return lines.slice(1).filter(l => l.trim()).map(l => {
      const v = parseCSVLine(l), o = {};
      h.forEach((k, i) => o[k.trim()] = v[i] != null ? v[i] : '');
      return o;
    });
  } else {
    const h = lines[0].split('\t').map(s => s.trim());
    return lines.slice(1).filter(l => l.trim()).map(l => {
      const v = l.split('\t').map(s => s.trim()), o = {};
      h.forEach((k, i) => o[k] = v[i] != null ? v[i] : '');
      return o;
    });
  }
}

async function fetchWithRetry(url, retries=3) {
  for (let i = 0; i < retries; i++) {
    try {
      const r = await fetch(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now());
      if (r.ok) return r;
      if (i === retries-1) throw new Error('HTTP ' + r.status);
    } catch(e) {
      if (i === retries-1) throw e;
      await new Promise(r => setTimeout(r, 800*(i+1)));
    }
  }
}

// ============================================================
// POLL MAP BUILDER
// ============================================================
function buildPollMap(rows) {
  const map = {};
  for (const row of rows) {
    const region = (row['region'] || row['Region'] || Object.values(row)[0] || '').trim();
    if (!region) continue;
    map[region] = {};
    MP.forEach(p => {
      map[region][p] = p === 'oth'
        ? (parseFloat(row['oth_pct'] || 0) || 0) + (parseFloat(row['rstr_pct'] || 0) || 0)
        : parseFloat(row[p + '_pct'] || 0) || 0;
    });
  }
  return map;
}

// ============================================================
// OPTION C MODEL
// ============================================================
function optionC(seat) {
  const code = seat.code;
  const p    = PARAMS[code] || {};
  const ovr  = OVERRIDES[code] || {};
  const std  = STANDING[code];
  const base = seat.votes;
  const regPoll = POLL_MAP[seat.region] || POLL_MAP['GB-wide'] || {};
  const regBase = BASELINE_2024[seat.region] || BASELINE_2024['GB-wide'];
  const raw = {};

  MP.forEach(party => {
    // If no standing row: only parties who stood in 2024 are standing by default
    const isStanding = std ? std[party] : (base[party] > 0);
    if (!isStanding) { raw[party] = 0; return; }

    const override = ovr[party];
    let local, refLevel;
    if (override) {
      // A by-election/local-election override: local baseline is the
      // recorded result, and — when a reference poll was recorded — swing
      // is measured from that snapshot instead of the 2024 baseline, so
      // the seat rides current polling instead of freezing at the result.
      // No reference poll recorded -> old behaviour, a flat pin (swing 0).
      local    = override.result / 100;
      refLevel = override.refPoll != null ? override.refPoll / 100 : (regPoll[party] || 0) / 100;
    } else {
      local    = base[party] || 0;
      if (local === 0) local = (FRESH[party] || 3) / 100; // standing but didn't contest 2024
      refLevel = (regBase[party] || 0) / 100;
    }

    const poll  = (regPoll[party] || 0) / 100;
    const swing = poll - refLevel;
    const hd    = Math.max(0, 1 - local);
    const mult  = Math.min(1.7, Math.max(0.25, parseFloat(p[party + '_multiplier'] || 1) || 1));
    const frac  = parseFloat(p[party + '_fraction'] || 0.2) || 0.2;
    const floor = local * frac;
    raw[party]  = Math.max(floor, Math.max(0, local + swing * hd * 2 * mult));
  });

  // Hard pins (override present, no reference poll recorded) keep their
  // exact entered value untouched by normalisation; everything else —
  // ordinary seats and poll-tracking overrides alike — is scaled to fill
  // whatever's left, same as the rest of the model.
  const hardPinned = MP.filter(party => ovr[party] && ovr[party].refPoll == null);
  if (hardPinned.length > 0) {
    const pinnedTotal = hardPinned.reduce((s, party) => s + (raw[party] || 0), 0);
    const free        = MP.filter(party => !hardPinned.includes(party));
    const freeTotal   = free.reduce((s, party) => s + (raw[party] || 0), 0);
    const scale       = freeTotal > 0 ? Math.max(0, 1 - pinnedTotal) / freeTotal : 0;
    free.forEach(party => raw[party] = (raw[party] || 0) * scale);
  } else {
    const tot = MP.reduce((s, party) => s + (raw[party] || 0), 0);
    if (tot > 0) MP.forEach(party => raw[party] = (raw[party] || 0) / tot);
  }

  // Tactical voting — second pass on top of Option C's own swung shares.
  // Runs even in seats with an override: applyTacticalVoting protects the
  // specific overridden parties from moving, but leaves everyone else in
  // the seat free to squeeze against each other normally.
  const tactical = applyTacticalVoting(seat, raw);

  const sorted = MP.slice().sort((a, b) => (tactical[b] || 0) - (tactical[a] || 0));
  return { winner: sorted[0], margin: ((tactical[sorted[0]] || 0) - (tactical[sorted[1]] || 0)) * 100, shares: tactical };
}

// ============================================================
// TACTICAL VOTING
// ============================================================
// Compass model: each party sits on an (econ, temper) position. For a donor
// party "from" considering a trailing rival "to" as somewhere to lend votes,
// its weight is how much closer "to" is to "from" than the seat's leader is
// (relCloseness), plus a small flat "anyone but them" floor scaled by how
// repugnant the leader is to "from" (so a little always leaks toward a
// viable ally even when it's not the ideologically closest one — this is
// what lets, say, a Con voter send a smidge to Labour specifically in a
// Lab/Reform marginal, without it happening in a Lab/Con marginal). A
// manual "Tactical Affinity" sheet entry overrides the computed weight for
// that specific pair.
//
// A party only ever lends "up" to a rival that's at least as strong as
// itself in that seat — never down to a weaker one. The total fraction of
// a party's vote that can leak at all is capped by its own willingness and
// by how attractive its best available option is (maxWeight) — not by
// summing affinities across every possible recipient, which would let a
// party with several so-so options leak an implausibly large share. Some
// of what leaks doesn't transfer anywhere (per-party "abstain" share) —
// it just evaporates, and the seat is renormalised back to 100% after.
function relCloseness(from, to, leader) {
  const pf = POSITIONS[from], pt = POSITIONS[to], pl = POSITIONS[leader];
  if (!pf || !pt || !pl || from === leader) return 0;
  const distTo     = Math.hypot(pf.econ - pt.econ, pf.temper - pt.temper);
  const distLeader = Math.hypot(pf.econ - pl.econ, pf.temper - pl.temper);
  if (distLeader <= 0) return 0;
  return Math.max(0, Math.min(1, (distLeader - distTo) / distLeader));
}

function repugnance(from, leader) {
  const pf = POSITIONS[from], pl = POSITIONS[leader];
  if (!pf || !pl) return 0;
  return Math.max(0, Math.min(1, Math.hypot(pf.econ - pl.econ, pf.temper - pl.temper) / D_SCALE));
}

function candidateWeight(from, to, leader) {
  const manual = AFFINITY[from] && AFFINITY[from][to];
  if (manual != null) return manual; // hand-set override, used as-is
  const w = relCloseness(from, to, leader) + PROTEST_FLOOR * repugnance(from, leader);
  return Math.max(0, Math.min(1, w));
}

function applyTacticalVoting(seat, shares) {
  if (!TACTICAL_ENABLED) return shares;

  // Only TRUE hard pins (an override with no reference poll — an explicit
  // "don't touch this number") are protected from tactical voting. A
  // poll-tracking override (has a reference poll) is just a better
  // baseline, same role a party's 2024 result plays normally — it fully
  // participates as a donor and recipient like anyone else. In practice
  // this means a seat with several poll-tracking overrides (the common
  // case — overriding most of a seat's parties at once from a by-election
  // or local election) still squeezes normally; only genuinely frozen
  // parties sit out.
  const seatOvr = OVERRIDES[seat.code] || {};
  const protectedParties = new Set(
    Object.keys(seatOvr).filter(party => seatOvr[party].refPoll == null)
  );

  const sorted = MP.slice().sort((a, b) => (shares[b] || 0) - (shares[a] || 0));
  const leader = sorted[0];
  const trailing = sorted.slice(1).filter(p => (shares[p] || 0) > 0.001);
  if (trailing.length < 2) return shares; // nothing to squeeze between

  const margin = (shares[leader] || 0) - (shares[trailing[0]] || 0);
  const closeness = Math.max(0, 1 - margin / CLOSENESS_SCALE);
  if (closeness <= 0) return shares;

  const seatIntensity = SEAT_INTENSITY[seat.code] != null ? SEAT_INTENSITY[seat.code] : 1;
  const intensity = seatIntensity * GLOBAL_INTENSITY;
  if (intensity <= 0) return shares;

  const adjusted = Object.assign({}, shares);
  trailing.forEach(from => {
    if (protectedParties.has(from)) return; // overridden parties never donate
    // Only lend "up" — to a rival at least as strong as yourself in this seat.
    const candidates = trailing.filter(to =>
      to !== from && !protectedParties.has(to) && (shares[to] || 0) >= (shares[from] || 0)
    );
    if (!candidates.length) return;

    const weights = {};
    let totalWeight = 0, maxWeight = 0;
    candidates.forEach(to => {
      const w = candidateWeight(from, to, leader);
      if (w > 0) { weights[to] = w; totalWeight += w; maxWeight = Math.max(maxWeight, w); }
    });
    if (totalWeight <= 0) return;

    const willingness = (POSITIONS[from] && POSITIONS[from].willingness) || 0;
    const leakFraction = Math.min(MAX_SQUEEZE_FRACTION, willingness * maxWeight * closeness * intensity);
    const totalLeak = (shares[from] || 0) * leakFraction;
    if (totalLeak <= 0) return;

    const abstainShare = (POSITIONS[from] && POSITIONS[from].abstain) || 0;
    const transferPool = totalLeak * (1 - abstainShare);
    candidates.forEach(to => {
      const w = weights[to]; if (!w) return;
      adjusted[to] = (adjusted[to] || 0) + transferPool * (w / totalWeight);
    });
    adjusted[from] = Math.max(0, (adjusted[from] || 0) - totalLeak);
  });

  // Abstention removes votes without handing them to anyone — renormalise
  // the seat back to 100%. Overridden parties are held exact, same as in
  // optionC(): everyone else absorbs the renormalisation instead.
  if (protectedParties.size > 0) {
    const protectedTotal = [...protectedParties].reduce((s, p) => s + (adjusted[p] || 0), 0);
    const free = MP.filter(p => !protectedParties.has(p));
    const freeTotal = free.reduce((s, p) => s + (adjusted[p] || 0), 0);
    const scale = freeTotal > 0 ? Math.max(0, 1 - protectedTotal) / freeTotal : 0;
    free.forEach(p => adjusted[p] = (adjusted[p] || 0) * scale);
  } else {
    const tot = MP.reduce((s, p) => s + (adjusted[p] || 0), 0);
    if (tot > 0) MP.forEach(p => adjusted[p] = (adjusted[p] || 0) / tot);
  }
  return adjusted;
}

// ============================================================
// RUN MODEL — updates DATA and broadcasts seat counts
// ============================================================
function runModel() {
  Object.values(DATA).forEach(seat => {
    const r   = optionC(seat);
    seat.winner = r.winner;
    seat.margin = r.margin;
    seat.shares = r.shares;
  });

  // Count seats per winner
  const counts = {};
  Object.values(DATA).forEach(seat => {
    counts[seat.winner] = (counts[seat.winner] || 0) + 1;
  });

  // Also compute the OPPOSITE tactical-voting scenario, purely so iframe1's
  // header can offer an instant "flick to compare" toggle without a round
  // trip. This doesn't touch seat.winner/margin/shares above — those stay
  // whatever the calculator actually asked for.
  const savedEnabled = TACTICAL_ENABLED;
  const altCounts = {};
  try {
    TACTICAL_ENABLED = !savedEnabled;
    Object.values(DATA).forEach(seat => {
      const r = optionC(seat);
      altCounts[r.winner] = (altCounts[r.winner] || 0) + 1;
    });
  } finally {
    TACTICAL_ENABLED = savedEnabled;
  }

  const withTactical    = savedEnabled ? counts : altCounts;
  const withoutTactical = savedEnabled ? altCounts : counts;

  // Broadcast to parent — iframe1 and iframe2 both receive this
  window.parent.postMessage({
    action: 'seatCounts', counts, withTactical, withoutTactical,
    tacticalEnabled: savedEnabled, isUserProjection: IS_USER_PROJECTION,
  }, '*');
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadData() {
  try {
    const [rResp, pResp, oResp, sResp, pollResp] = await Promise.all([
      fetchWithRetry(RESULTS_URL),
      fetchWithRetry(PARAMS_URL  + '&_=' + Date.now()),
      fetchWithRetry(OVERRIDE_URL + '&_=' + Date.now()),
      fetchWithRetry(STANDING_URL + '&_=' + Date.now()),
      fetchWithRetry(POLL_CSV    + '&_=' + Date.now()),
    ]);

    if (pResp && pResp.ok) {
      parseCSV(await pResp.text()).forEach(row => {
        const code = (row['PCON24CD'] || '').trim();
        if (code) PARAMS[code] = row;
      });
    }

    if (oResp && oResp.ok) {
      parseCSV(await oResp.text()).forEach(row => {
        const code = (row['PCON24CD'] || '').trim(); if (!code) return;
        const ovr = {};
        MP.forEach(p => {
          const v = parseFloat(row[p]);
          if (isNaN(v) || v <= 0 || row[p] === '' || row[p] === '0') return;
          // {party}_ref = regional poll level when the result was recorded.
          // Present -> the override rides current polling like any other
          // seat (local baseline + swing since that reference point).
          // Blank  -> old behaviour, a flat pin with no swing applied.
          const refRaw = row[p + '_ref'];
          const ref = parseFloat(refRaw);
          ovr[p] = { result: v, refPoll: (refRaw !== undefined && refRaw !== '' && !isNaN(ref)) ? ref : null };
        });
        if (Object.keys(ovr).length) OVERRIDES[code] = ovr;
      });
    }

    if (sResp && sResp.ok) {
      parseCSV(await sResp.text()).forEach(row => {
        const code = (row['PCON24CD'] || '').trim(); if (!code) return;
        const std = {}; MP.forEach(p => { std[p] = row[p] !== '0'; });
        STANDING[code] = std;
      });
    }

    if (pollResp && pollResp.ok) {
      POLL_MAP = buildPollMap(parseCSV(await pollResp.text()));
    }

    // Optional: Tactical Affinity + Tactical Intensity tabs. Missing/unset
    // is fine — falls back to DEFAULT_AFFINITY and no seat overrides.
    if (AFFINITY_URL) {
      try {
        const aResp = await fetchWithRetry(AFFINITY_URL + '&_=' + Date.now());
        if (aResp && aResp.ok) {
          const parsed = {};
          parseCSV(await aResp.text()).forEach(row => {
            const from = (row['from'] || row['party'] || Object.values(row)[0] || '').trim().toLowerCase();
            if (!from) return;
            parsed[from] = {};
            MP.forEach(to => {
              const v = parseFloat(row[to]);
              if (!isNaN(v) && v > 0) parsed[from][to] = v / 100;
            });
          });
          if (Object.keys(parsed).length) AFFINITY = parsed;
        }
      } catch (e) { console.warn('Tactical affinity fetch failed, using defaults:', e); }
    }

    if (INTENSITY_URL) {
      try {
        const iResp = await fetchWithRetry(INTENSITY_URL + '&_=' + Date.now());
        if (iResp && iResp.ok) {
          const parsed = {};
          parseCSV(await iResp.text()).forEach(row => {
            const code = (row['PCON24CD'] || '').trim(); if (!code) return;
            const v = parseFloat(row['intensity']);
            if (!isNaN(v)) parsed[code] = v;
          });
          SEAT_INTENSITY = parsed;
        }
      } catch (e) { console.warn('Tactical intensity fetch failed, using defaults:', e); }
    }

    if (POSITIONS_URL) {
      try {
        const posResp = await fetchWithRetry(POSITIONS_URL + '&_=' + Date.now());
        if (posResp && posResp.ok) {
          const parsed = {};
          parseCSV(await posResp.text()).forEach(row => {
            const party = (row['party'] || Object.values(row)[0] || '').trim().toLowerCase();
            if (!party) return;
            const econ = parseFloat(row['econ']), temper = parseFloat(row['temper']),
                  willingness = parseFloat(row['willingness']), abstain = parseFloat(row['abstain']);
            parsed[party] = {
              econ: isNaN(econ) ? 0 : econ,
              temper: isNaN(temper) ? 0.5 : temper,
              willingness: isNaN(willingness) ? 0 : willingness,
              abstain: isNaN(abstain) ? 0 : abstain,
            };
          });
          if (Object.keys(parsed).length) POSITIONS = parsed;
        }
      } catch (e) { console.warn('Tactical positions fetch failed, using defaults:', e); }
    }

    if (!rResp || !rResp.ok) throw new Error('results_2024.csv fetch failed');
    parseCSV(await rResp.text()).forEach(row => {
      const code   = (row['PCON24CD'] || '').trim();
      const region = (row['Region'] || row['region'] || '').trim();
      if (!code || region === 'Northern Ireland' || NI_CODES.has(code)) return;
      const votes = {};
      MP.forEach(p => {
        votes[p] = p === 'oth'
          ? ((parseFloat(row['oth_pct']) || 0) + (parseFloat(row['rstr_pct']) || 0) + (parseFloat(row['ind_pct']) || 0)) / 100
          : (parseFloat(row[p + '_pct']) || 0) / 100;
      });
      const defender = WM[(row['Winner'] || '').trim()] || 'oth';
      DATA[code] = { code, name: row['Constituency name'], region, defender, votes,
                     winner: defender, margin: 0, shares: {} };
    });

    // Run model with live polling
    runModel();

  } catch(e) {
    console.error('loadData failed:', e);
  }
}

// INCOMING POLL MAP FROM IFRAME2
// ============================================================
window.addEventListener('message', e => {
  if (!e.data) return;

  if (e.data.action === 'forecastUpdate' && e.data.pollMap) {
    POLL_MAP = e.data.pollMap;
    if (typeof e.data.tacticalEnabled === 'boolean') TACTICAL_ENABLED = e.data.tacticalEnabled;
    if (typeof e.data.tacticalIntensity === 'number' && !isNaN(e.data.tacticalIntensity)) GLOBAL_INTENSITY = e.data.tacticalIntensity;
    IS_USER_PROJECTION = !!e.data.isUserProjection;
    runModel();
    // Re-render whatever view mode is currently active (Winner/Share/Swing),
    // not just the winner colours — a stale map used to snap back to Winner
    // colours on every re-run even if you had Share or Swing selected.
    if (window._map && window._map.isStyleLoaded() && window._refreshView) {
      window._refreshView();
    }
  }

  if (e.data.action === 'exportCSV') {
    downloadCSV();
  }

  if (e.data.action === 'scrollToMap') {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

// ============================================================
// PANEL BUILDERS
// ============================================================
function chgClass(v){return v>0.05?'chg-pos':v<-0.05?'chg-neg':'chg-nil';}
function chgStr(v){const s=Math.abs(v).toFixed(1);return v>0.05?'+'+s:v<-0.05?'\u2212'+s:'\u2014';}

function stackedBarHTML(shares, cls){
  return '<div class="stacked-bar '+cls+'">'+BAR_ORDER.filter(p=>(shares[p]||0)>0.005).map(p=>'<div style="width:'+((shares[p]||0)*100).toFixed(2)+'%;background:'+(PARTIES[p]?.color||'#ccc')+';height:100%;"></div>').join('')+'</div>';
}

function updateResultBar(d){
  const winner=PARTIES[d.winner]||PARTIES.oth;
  const incumbent=PARTIES[d.defender]||winner;
  const held=d.winner===d.defender;
  const label=held?winner.label+' hold':winner.label+' gain from '+incumbent.label;
  document.getElementById('result-bar-incumbent').style.background=incumbent.color;
  document.getElementById('result-bar-fill').style.background=winner.color;
  document.getElementById('result-bar-text').textContent=label;
}

function buildPanelBody(d){
  // projected shares sorted by size
  const sorted=MP.filter(p=>(d.shares[p]||0)>0.005||(d.votes[p]||0)>0.005).sort((a,b)=>(d.shares[b]||0)-(d.shares[a]||0));
  const max=(d.shares[sorted[0]]||0)*100||1;
  const rows=sorted.map(p=>{
    const proj=(d.shares[p]||0)*100;
    const base=(d.votes[p]||0)*100;
    const chg=proj-base;
    const party=PARTIES[p]||PARTIES.oth;
    return '<tr><td><div class="party-cell"><div class="party-stripe" style="background:'+party.color+';"></div><span class="party-name">'+party.label+'</span></div></td><td class="pct-cell">'+proj.toFixed(1)+'</td><td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:'+(proj/max*100).toFixed(1)+'%;background:'+party.color+';"></div></div></td><td class="chg-cell '+chgClass(chg)+'">'+chgStr(chg)+'</td></tr>';
  }).join('');

  // Projected shares stacked bar + thin 2024 bar beneath
  const prevShares={};MP.forEach(p=>{prevShares[p]=d.votes[p]||0;});
  return '<div class="stacked-section"><div class="stacked-label">Result vs. 2024</div>'+stackedBarHTML(d.shares,'')+stackedBarHTML(prevShares,'previous')+'</div><table class="results-table"><thead><tr><th>Party</th><th>Pct.</th><th></th><th>Chg.</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function showSidePanel(code){
  const d=DATA[code];if(!d)return;
  updateResultBar(d);
  document.getElementById('panel-header').innerHTML='<div class="con-name">'+d.name+'</div><div class="con-region">'+d.region+'</div>';
  document.getElementById('panel-body').innerHTML=buildPanelBody(d);
  document.getElementById('side-panel').classList.add('is-visible');
}

// ============================================================
// MAP STYLE — MapLibre with OpenFreeMap vector tiles
// ============================================================
function buildColorMatch(){
  const expr=['match',['get','PCON24CD']];
  Object.entries(DATA).forEach(([code,d])=>{expr.push(code,PARTIES[d.winner]?.color||'#888780');});
  // NI = grey
  NI_CODES.forEach(c=>expr.push(c,'#c8c5be'));
  expr.push('#cccccc');
  return expr;
}

function buildMapStyle(geojsonData){
  const colorMatch=buildColorMatch();
  // Flipped-seat highlighting defaults to Off, so the initial paint just
  // uses the same flat constants as applyFlips()'s off branch — no need to
  // bake a per-seat expression (or risk a setPaintProperty call before the
  // style has loaded, see initChoropleth's applyFlips()) until the user
  // actually switches it on.
  return{
    version:8,
    glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources:{
      basemap:{type:'vector',url:'https://tiles.openfreemap.org/planet'},
      cons:{type:'geojson',data:geojsonData,generateId:true},
    },
    layers:[
      {id:'bg',type:'background',paint:{'background-color':'rgba(255,255,255,1)'}},
      {id:'water',type:'fill',source:'basemap','source-layer':'water',paint:{'fill-color':'hsl(180,45%,97%)','fill-opacity':0.8}},
      {id:'landcover-green',type:'fill',source:'basemap','source-layer':'landuse',filter:['in',['get','class'],['literal',['park','grass','cemetery','forest','meadow','nature_reserve']]],paint:{'fill-color':'hsl(82,46%,72%)','fill-opacity':0.5}},
      {id:'landuse-residential',type:'fill',source:'basemap','source-layer':'landuse',filter:['in',['get','class'],['literal',['residential','suburb','neighbourhood']]],paint:{'fill-color':'rgba(222,211,190,1)','fill-opacity':0.45}},
      {id:'road-path',type:'line',source:'basemap','source-layer':'transportation',filter:['in',['get','class'],['literal',['path','track','service']]],paint:{'line-color':'rgba(200,195,185,1)','line-width':['interpolate',['linear'],['zoom'],13,0.4,17,1.2]}},
      {id:'road-minor',type:'line',source:'basemap','source-layer':'transportation',filter:['in',['get','class'],['literal',['minor','residential']]],paint:{'line-color':'rgba(210,205,192,1)','line-width':['interpolate',['linear'],['zoom'],11,0.4,15,2]}},
      {id:'road-secondary',type:'line',source:'basemap','source-layer':'transportation',filter:['in',['get','class'],['literal',['secondary','tertiary']]],paint:{'line-color':'rgba(200,193,178,1)','line-width':['interpolate',['linear'],['zoom'],9,0.5,14,3]}},
      {id:'road-primary',type:'line',source:'basemap','source-layer':'transportation',filter:['in',['get','class'],['literal',['primary']]],paint:{'line-color':'rgba(188,178,160,1)','line-width':['interpolate',['linear'],['zoom'],8,0.8,14,4]}},
      {id:'road-motorway',type:'line',source:'basemap','source-layer':'transportation',filter:['in',['get','class'],['literal',['motorway','trunk']]],paint:{'line-color':'rgba(175,165,145,1)','line-width':['interpolate',['linear'],['zoom'],6,1,14,5]}},
      {id:'railway',type:'line',source:'basemap','source-layer':'transportation',filter:['==',['get','class'],'rail'],paint:{'line-color':'hsl(34,12%,66%)','line-width':1,'line-opacity':0.7}},
      {id:'buildings',type:'fill',source:'basemap','source-layer':'building',minzoom:12,paint:{'fill-color':'rgba(185,176,169,1)','fill-opacity':0.9,'fill-outline-color':'rgba(165,156,148,1)'}},
      // Constituency fills
      {id:'cons-fill',type:'fill',source:'cons',paint:{'fill-color':colorMatch,'fill-opacity':0.55}},
      {id:'cons-line',type:'line',source:'cons',paint:{'line-color':'#000000','line-width':0.6,'line-opacity':0.4}},
      // Hover overlay (brightens)
      {id:'cons-hover',type:'fill',source:'cons',paint:{'fill-color':colorMatch,'fill-opacity':['case',['boolean',['feature-state','hover'],false],0.3,0]}},
      // Pinned outline
      {id:'cons-pinned',type:'line',source:'cons',paint:{'line-color':'#111111','line-width':2,'line-opacity':['case',['boolean',['feature-state','pinned'],false],1,0]}},
      // Place labels on top
      {id:'place-labels',type:'symbol',source:'basemap','source-layer':'place',filter:['in',['get','class'],['literal',['city','town','suburb','village']]],layout:{'text-field':['get','name'],'text-font':['Noto Sans Regular'],'text-size':['interpolate',['linear'],['zoom'],9,10,13,14],'text-anchor':'center','text-max-width':8},paint:{'text-color':'hsl(0,0%,25%)','text-halo-color':'hsla(0,0%,100%,0.85)','text-halo-width':2}},
    ],
  };
}

// ============================================================
// MAP INIT
// ============================================================
function initMap(geojsonData){
  const container=document.getElementById('map-container');
  const sidePanel=document.getElementById('side-panel');
  const drawer=document.getElementById('drawer');
  const pinEl=document.getElementById('pin-indicator');
  let isWide=false,hoveredId=null,pinnedId=null;

  function unpin(){
    if(pinnedId!==null&&window._map)window._map.setFeatureState({source:'cons',id:pinnedId},{pinned:false});
    pinnedId=null;pinEl.classList.remove('active');
  }
  pinEl.addEventListener('click',unpin);

  function applyLayout(wide){
    isWide=wide;
    // The map is always full-width now — the side panel floats over it as
    // a card and only appears once something's actually hovered/pinned
    // (see showSidePanel), so there's no permanently-reserved empty column.
    if(wide){
      drawer.classList.remove('drawer-enabled');dismissDrawer();unpin();
    }else{
      sidePanel.classList.remove('is-visible');
      drawer.classList.add('drawer-enabled');
    }
    if(window._map)window._map.resize();
  }

  applyLayout(container.offsetWidth>=660);

  window._map=new maplibregl.Map({
    container:'map',
    style:buildMapStyle(geojsonData),
    center:[-2.5,54.5],
    zoom:5.2,
    attributionControl:false,
  });

  const map=window._map;
  // Rotation isn't useful for a GB choropleth and just risks users getting
  // the map stuck at an odd angle — block every gesture that can rotate it
  // (drag, touch-twist, keyboard) while leaving pan/zoom untouched.
  map.dragRotate.disable();
  map.touchZoomRotate.disableRotation();
  map.keyboard.disableRotation();
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-left');
  map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-left');
  map.on('error',e=>console.warn('MapLibre:',e.error?.message||e));

  map.on('load',()=>{
    // Fit to GB bounds
    map.fitBounds([[-8.2,49.8],[1.8,60.9]],{padding:20,duration:0});

    // Hover
    map.on('mousemove','cons-fill',e=>{
      if(!isWide||pinnedId!==null)return;
      map.getCanvas().style.cursor='pointer';
      if(e.features.length>0){
        const fid=e.features[0].id,code=e.features[0].properties.PCON24CD;
        if(NI_CODES.has(code))return;
        if(hoveredId!==null&&hoveredId!==fid)map.setFeatureState({source:'cons',id:hoveredId},{hover:false});
        hoveredId=fid;map.setFeatureState({source:'cons',id:hoveredId},{hover:true});
        showSidePanel(code);
      }
    });

    map.on('mouseleave','cons-fill',()=>{
      if(!isWide||pinnedId!==null)return;
      map.getCanvas().style.cursor='';
      if(hoveredId!==null){map.setFeatureState({source:'cons',id:hoveredId},{hover:false});hoveredId=null;}
    });

    // Click to pin
    map.on('click',e=>{
      const features=map.queryRenderedFeatures(e.point,{layers:['cons-fill']});
      if(!features.length){unpin();return;}
      const fid=features[0].id,code=features[0].properties.PCON24CD;
      if(NI_CODES.has(code))return;
      const d=DATA[code];
      if(isWide){
        if(pinnedId===fid){unpin();return;}
        if(pinnedId!==null)map.setFeatureState({source:'cons',id:pinnedId},{pinned:false});
        if(hoveredId!==null){map.setFeatureState({source:'cons',id:hoveredId},{hover:false});hoveredId=null;}
        pinnedId=fid;map.setFeatureState({source:'cons',id:pinnedId},{pinned:true});
        showSidePanel(code);
        if(d){const p=PARTIES[d.winner]||PARTIES.oth;document.getElementById('pin-dot').style.background=p.color;document.getElementById('pin-name').textContent=d.name;pinEl.classList.add('active');}
      }else{
        showDrawer(code);
      }
    });
  });

  initSearch(geojsonData,map,()=>isWide);
  initChoropleth(map);

  const ro=new ResizeObserver(entries=>{const w=entries[0].contentRect.width;const nowWide=w>=660;if(nowWide!==isWide)applyLayout(nowWide);});
  ro.observe(container);
}

// ============================================================
// CHOROPLETH
// ============================================================
function hexToRgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}

// Blend a party colour toward the legend's neutral background at intensity
// t (0 = background, 1 = full party colour) — used to build discrete tint
// bins for the Share view, rather than reading an exact value off a ramp.
const TINT_BG = [245,245,245];
function tintBlend(hex,t){
  const [r,g,b]=hexToRgb(hex);
  const nr=Math.round(TINT_BG[0]+(r-TINT_BG[0])*t);
  const ng=Math.round(TINT_BG[1]+(g-TINT_BG[1])*t);
  const nb=Math.round(TINT_BG[2]+(b-TINT_BG[2])*t);
  return 'rgb('+nr+','+ng+','+nb+')';
}

// Vote share (Share view) — discrete tint bins instead of a gradient, same
// reasoning as SWING_BINS: which band a seat falls in matters more than an
// exact percentage read off a continuous ramp.
const SHARE_BIN_FRACTIONS=[0.15,0.30,0.45,0.60,0.75,0.90,1.0];
function shareBinColor(pct,ceiling,hex){
  const frac=ceiling>0?pct/ceiling:0;
  for(const f of SHARE_BIN_FRACTIONS){if(frac<=f)return tintBlend(hex,f);}
  return tintBlend(hex,1.0);
}

function buildChoroplethExpr(partyKey,ceiling){
  const hex=PARTIES[partyKey].color;
  const matchExpr=['match',['get','PCON24CD']];
  Object.entries(DATA).forEach(([code,d])=>{
    const pct=Math.min((d.shares[partyKey]||0)*100,ceiling);
    matchExpr.push(code,shareBinColor(pct,ceiling,hex));
  });
  matchExpr.push(tintBlend(hex,SHARE_BIN_FRACTIONS[0]));
  return matchExpr;
}

// Party swing since 2024 — how a SINGLE party's own vote share has moved in
// each seat, independent of who wins it. Discrete bins (not a gradient):
// deciding whether a seat is "up" or "down" for a party matters more than
// reading an exact number off a continuous ramp. Bins standardised to 5pt
// steps out to ±20pt; no separate "flat" bucket — the near-zero bin just
// falls out of the same tint blend used for the rest of the scale.
const SWING_NEG = '#d45a49';
const SWING_POS = '#009076';
const SWING_BREAKS = [-20,-15,-10,-5,5,10,15,20];
const SWING_BINS = SWING_BREAKS.map((max,i)=>{
  const mid = i===0 ? max : (SWING_BREAKS[i-1]+max)/2;
  const t = Math.min(Math.abs(mid)/20,1);
  return {max, color:tintBlend(mid<0?SWING_NEG:SWING_POS, t)};
});
SWING_BINS.push({max:Infinity, color:SWING_POS});
function swingBinColor(pts){for(const b of SWING_BINS){if(pts<b.max)return b.color;}return SWING_BINS[SWING_BINS.length-1].color;}

function buildSwingExpr(partyKey){
  const matchExpr=['match',['get','PCON24CD']];
  Object.entries(DATA).forEach(([code,d])=>{
    const pts=((d.shares[partyKey]||0)-(d.votes[partyKey]||0))*100;
    matchExpr.push(code,swingBinColor(pts));
  });
  matchExpr.push('#e5e5e5');
  return matchExpr;
}

// Flipped-seat highlighting (Winner view only) — flipped seats render at
// full opacity with a bold dark border; held seats mute back so the flips
// read at a glance. Built the same way buildColorMatch() is: a per-code
// match expression, no feature-state needed.
function buildFlipFillOpacityExpr(){
  const e=['match',['get','PCON24CD']];
  Object.entries(DATA).forEach(([code,d])=>{e.push(code,d.winner!==d.defender?0.55:0.18);});
  e.push(0.55);
  return e;
}
// Zoom-scaled so the flip border reads as a bold outline once you're
// looking at an individual seat, but doesn't overwhelm the map at a
// distant, GB-wide zoom.
function buildFlipLineWidthExprAt(heldW,flipW){
  const e=['match',['get','PCON24CD']];
  Object.entries(DATA).forEach(([code,d])=>{e.push(code,d.winner!==d.defender?flipW:heldW);});
  e.push(heldW);
  return e;
}
function buildFlipLineWidthExpr(){
  return['interpolate',['linear'],['zoom'],
    5,buildFlipLineWidthExprAt(0.5,1.0),
    8,buildFlipLineWidthExprAt(0.6,1.8),
    11,buildFlipLineWidthExprAt(0.7,2.8)
  ];
}
function buildFlipLineOpacityExpr(){
  const e=['match',['get','PCON24CD']];
  Object.entries(DATA).forEach(([code,d])=>{e.push(code,d.winner!==d.defender?0.9:0.4);});
  e.push(0.4);
  return e;
}

function initChoropleth(map){
  const modeBtns=document.querySelectorAll('.vc-btn[data-mode]');
  const flipBtns=document.querySelectorAll('.vc-btn[data-flip]');
  const partyWrap=document.getElementById('party-select-wrap');
  const flipWrap=document.getElementById('flip-controls');
  const partySelect=document.getElementById('party-select');
  const legend=document.getElementById('choropleth-legend');
  const legendTitle=document.getElementById('legend-title');
  const legendBins=document.getElementById('legend-bins');
  const legendBinsRow=document.getElementById('legend-bins-row');
  const legendBinsLabels=document.querySelectorAll('#legend-bins-labels span');
  const flipLegend=document.getElementById('flip-legend');
  let currentMode='winner',currentParty='lab',flipsOn=false;

  Object.entries(PARTIES).forEach(([key,p])=>{const opt=document.createElement('option');opt.value=key;opt.textContent=p.label;partySelect.appendChild(opt);});
  partySelect.value=currentParty;

  // Bins row/labels are rebuilt per mode — Swing uses the fixed semantic
  // red/green scale, Share uses tint bins for whichever party is selected.
  function renderLegendBins(colors,labels){
    legendBinsRow.innerHTML='';
    colors.forEach(c=>{const sw=document.createElement('div');sw.className='bin';sw.style.background=c;legendBinsRow.appendChild(sw);});
    labels.forEach((t,i)=>{if(legendBinsLabels[i])legendBinsLabels[i].textContent=t;});
  }

  function getWinnerExpr(){const e=['match',['get','PCON24CD']];Object.entries(DATA).forEach(([code,d])=>{e.push(code,PARTIES[d.winner]?.color||'#cccccc');});NI_CODES.forEach(c=>e.push(c,'#c8c5be'));e.push('#cccccc');return e;}

  function applyFlips(){
    // Only meaningful in Winner view — Share/Swing already use fill colour
    // and opacity to carry their own signal.
    if(currentMode==='winner'&&flipsOn){
      map.setPaintProperty('cons-fill','fill-opacity',buildFlipFillOpacityExpr());
      map.setPaintProperty('cons-line','line-width',buildFlipLineWidthExpr());
      map.setPaintProperty('cons-line','line-opacity',buildFlipLineOpacityExpr());
      flipLegend.classList.add('visible');
    }else{
      if(currentMode==='winner')map.setPaintProperty('cons-fill','fill-opacity',0.55);
      map.setPaintProperty('cons-line','line-width',0.6);
      map.setPaintProperty('cons-line','line-opacity',0.4);
      flipLegend.classList.remove('visible');
    }
  }

  function applyMode(mode,party){
    currentMode=mode;currentParty=party;
    flipWrap.classList.toggle('hidden',mode!=='winner');
    if(mode==='winner'){
      map.setPaintProperty('cons-fill','fill-color',getWinnerExpr());
      map.setPaintProperty('cons-hover','fill-color',getWinnerExpr());
      partyWrap.classList.remove('visible');
      legend.classList.remove('visible');legendBins.classList.remove('visible');
      applyFlips();
    }else if(mode==='share'){
      const ceiling=CHOROPLETH_CEILINGS[party]||50;
      const expr=buildChoroplethExpr(party,ceiling);
      map.setPaintProperty('cons-fill','fill-color',expr);
      map.setPaintProperty('cons-fill','fill-opacity',0.85);
      map.setPaintProperty('cons-hover','fill-color',expr);
      map.setPaintProperty('cons-line','line-width',0.6);
      map.setPaintProperty('cons-line','line-opacity',0.4);
      partyWrap.classList.add('visible');
      flipLegend.classList.remove('visible');
      const p=PARTIES[party];
      legendTitle.textContent=p.label+' vote share';
      const shareColors=SHARE_BIN_FRACTIONS.map(f=>tintBlend(p.color,f));
      const mid=Math.round(ceiling*SHARE_BIN_FRACTIONS[Math.floor(SHARE_BIN_FRACTIONS.length/2)]);
      renderLegendBins(shareColors,['0%',mid+'%',ceiling+'%+']);
      legend.classList.add('visible');legendBins.classList.add('visible');
    }else{ // swing
      const expr=buildSwingExpr(party);
      map.setPaintProperty('cons-fill','fill-color',expr);
      map.setPaintProperty('cons-fill','fill-opacity',0.85);
      map.setPaintProperty('cons-hover','fill-color',expr);
      map.setPaintProperty('cons-line','line-width',0.6);
      map.setPaintProperty('cons-line','line-opacity',0.4);
      partyWrap.classList.add('visible');
      flipLegend.classList.remove('visible');
      const p=PARTIES[party];
      legendTitle.textContent=p.label+' vote share vs. 2024';
      renderLegendBins(SWING_BINS.map(b=>b.color),['−20pt','','+20pt']);
      legend.classList.add('visible');legendBins.classList.add('visible');
    }
  }

  modeBtns.forEach(btn=>{btn.addEventListener('click',()=>{modeBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');applyMode(btn.dataset.mode,currentParty);});});
  flipBtns.forEach(btn=>{btn.addEventListener('click',()=>{flipBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');flipsOn=btn.dataset.flip==='on';applyFlips();});});
  partySelect.addEventListener('change',()=>applyMode(currentMode,partySelect.value));

  // Re-apply whatever's currently active after a model re-run (forecastUpdate).
  window._refreshView=()=>applyMode(currentMode,currentParty);

  // Flipped seats default to Off (see buildMapStyle/flipsOn above), so the
  // flip legend stays hidden until the user actually switches it on — no
  // sync needed here, unlike when the default was On.
}

// ============================================================
// SEARCH
// ============================================================
function initSearch(geojsonData,map,isWideFn){
  const input=document.getElementById('search-input');
  const results=document.getElementById('search-results');

  const boundsByCode={};
  geojsonData.features.forEach(f=>{
    const code=f.properties?.PCON24CD;if(!code||!f.geometry)return;
    const coords=f.geometry.type==='Polygon'?f.geometry.coordinates[0]:f.geometry.coordinates.flat(2);
    if(!coords.length)return;
    const lngs=coords.map(c=>c[0]),lats=coords.map(c=>c[1]);
    boundsByCode[code]=[[lngs.reduce((a,b)=>Math.min(a,b)),lats.reduce((a,b)=>Math.min(a,b))],[lngs.reduce((a,b)=>Math.max(a,b)),lats.reduce((a,b)=>Math.max(a,b))]];
  });

  const entries=Object.entries(DATA).map(([code,d])=>({code,name:d.name||code,region:d.region||'',winner:d.winner,searchStr:(d.name+' '+(d.region||'')).toLowerCase()}));

  function closeResults(){results.classList.remove('open');results.innerHTML='';}

  function selectEntry(entry){
    input.value=entry.name;closeResults();
    const bounds=boundsByCode[entry.code];
    if(bounds&&map)map.fitBounds(bounds,{padding:80,maxZoom:10,duration:600});
    if(isWideFn())showSidePanel(entry.code);else showDrawer(entry.code);
  }

  input.addEventListener('input',()=>{
    const q=input.value.trim().toLowerCase();if(q.length<2){closeResults();return;}
    const matches=entries.filter(e=>e.searchStr.includes(q)).slice(0,8);
    if(!matches.length){results.innerHTML='<div class="search-no-results">No results found</div>';results.classList.add('open');return;}
    results.innerHTML=matches.map(e=>{const p=PARTIES[e.winner]||PARTIES.oth;const name=e.name.replace(new RegExp(q,'gi'),m=>'<strong>'+m+'</strong>');return'<div class="search-result-item" data-code="'+e.code+'"><div class="search-result-dot" style="background:'+p.color+';"></div><div class="search-result-text"><div class="search-result-ward">'+name+'</div><div class="search-result-council">'+e.region+'</div></div></div>';}).join('');
    results.classList.add('open');
    results.querySelectorAll('.search-result-item').forEach(el=>{el.addEventListener('click',()=>{const entry=entries.find(e=>e.code===el.dataset.code);if(entry)selectEntry(entry);});});
  });

  document.addEventListener('click',e=>{if(!document.getElementById('search-wrap').contains(e.target))closeResults();});
  input.addEventListener('keydown',e=>{if(e.key==='Escape'){closeResults();input.blur();}if(e.key==='Enter'){const first=results.querySelector('.search-result-item');if(first)first.click();}});
}

// ============================================================
// BOOTSTRAP
// ============================================================
async function bootstrap(){
  await loadData();

  // Try to fetch GeoJSON with proxy fallback
  let geojsonData=null;
  const proxies=[u=>u,u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?'+encodeURIComponent(u)];
  for(const proxy of proxies){
    try{
      const r=await fetch(proxy(GEO_URL),{signal:AbortSignal.timeout(20000)});
      if(r.ok){const t=await r.text();if(t.length>1000){geojsonData=JSON.parse(t);break;}}
    }catch(e){}
  }

  if(!geojsonData){
    document.getElementById('map').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:#aaa;text-align:center;padding:24px;">Map loads when hosted on GitHub Pages.<br>CORS restriction prevents loading in sandbox preview.</div>';
    return;
  }

  // Filter out NI from GeoJSON (greyed via colour match but still present for context)
  initMap(geojsonData);
}

bootstrap();

// ── CSV download ──────────────────────────────────────────────────────────────
function downloadCSV() {
  const parties = ['con','lab','ldem','grn','snp','pc','ref','oth'];
  const pLabels = {con:'Con',lab:'Lab',ldem:'LDem',grn:'Grn',snp:'SNP',pc:'PC',ref:'Reform',oth:'Other'};
  const header  = ['PCON24CD','Constituency','Region','Projected Winner',
    ...parties.map(p => pLabels[p] + ' %'),
    ...parties.map(p => pLabels[p] + ' 2024 %')].join(',');

  const rows = Object.values(DATA)
    .sort((a,b) => a.name.localeCompare(b.name))
    .map(d => {
      const winner = (d.winner||'oth').toUpperCase();
      const shares = parties.map(p => ((d.shares[p]||0)*100).toFixed(1));
      const votes  = parties.map(p => ((d.votes[p]||0)*100).toFixed(1));
      return [
        d.code,
        '"' + (d.name||'').replace(/"/g,'""') + '"',
        '"' + (d.region||'') + '"',
        winner,
        ...shares,
        ...votes,
      ].join(',');
    });

  if (!rows.length) { alert('No data loaded yet — please wait for the map to load.'); return; }

  const csv  = [header, ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'britain_predicts_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Auto-resize ──────────────────────────────────────────────────────────
// #map-container has a fixed CSS height, so this is mostly a one-off report
// (the control bar can wrap on narrow widths, changing total height) rather
// than something that fires continuously — but reporting via ResizeObserver
// keeps it correct if that ever changes. See README.md for the parent-page
// listener this depends on.
function reportHeight() {
  window.parent.postMessage({ action:'resize', frame:'map', height:document.documentElement.scrollHeight }, '*');
}
new ResizeObserver(reportHeight).observe(document.body);
window.addEventListener('load', reportHeight);
</script>
