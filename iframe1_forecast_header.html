<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Britain Predicts</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; }
body { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; background:#fff; }
#loading { padding:24px; color:#999; font-size:13px; text-align:center; }
#error   { padding:16px; color:#c00; font-size:12px; display:none; }
#wrap    { display:none; background:#fff; }

#tiles-wrap { padding:0; }
.tiles   { display:grid; grid-template-columns:repeat(2,1fr); gap:0.5rem; }
@media(min-width:480px){ .tiles { grid-template-columns:repeat(4,1fr); } }
.tile    { display:flex; flex-direction:column; align-items:flex-end; padding:1.125rem 1rem 1rem; border-radius:0; color:#fff; }
.t-num   { font-size:3.5rem; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; text-align:right; }
.t-chg   { font-size:2rem; font-weight:500; margin-top:0.25rem; font-variant-numeric:tabular-nums; color:rgba(255,255,255,.82); text-align:right; }
.t-rule  { height:2px; margin:0.5rem 0; background:rgba(0,0,0,.25); align-self:stretch; }
.t-label { font-size:2rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase; text-align:right; }

/* Skeleton state — card frames (colour/label) show immediately; the number
   itself pulses until the real per-seat model finishes in iframe3 and posts
   seatCounts back. */
.tile-skeleton .t-num, .tile-skeleton .t-chg { animation:tile-pulse 1.4s ease-in-out infinite; }
@keyframes tile-pulse { 0%,100% { opacity:.5; } 50% { opacity:.95; } }

.load-status { display:none; font-size:0.75rem; color:#999; text-align:center; padding:0 1rem 0.75rem; }
.load-status.visible { display:block; }

#tactical-wrap.tactical-loading .tactical-row { opacity:.5; }
#tactical-wrap.tactical-loading .toggle-tap   { cursor:default; }

#btns    { display:flex; flex-direction:column; gap:0.5rem; padding:0; }
@media(min-width:480px){ #btns { flex-direction:row; gap:0.625rem; } }
.btn     { width:100%; padding:1rem; border:none; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; transition:background .15s; }
@media(min-width:480px){ .btn { flex:1; width:auto; padding:0.875rem 1rem; } }
.btn-primary   { background:#111; color:#fff; }
.btn-primary:hover   { background:#333; }
.btn-secondary { background:#f0ede8; color:#111; }
.btn-secondary:hover { background:#e5e0da; }

#tactical-wrap  { padding:0 1rem 1.125rem; }
@media(min-width:480px){ #tactical-wrap { padding:0 1.25rem 1.125rem; } }
.tactical-row   { display:flex; align-items:center; justify-content:space-between; gap:0.625rem; padding:0.75rem 0.875rem; border-radius:8px; background:#f5f5f5; }
.tactical-label { font-size:1rem; font-weight:600; color:#333; }
.toggle-tap     { display:flex; align-items:center; gap:0.5rem; cursor:pointer; flex-shrink:0; padding:0.6875rem 0.25rem; margin:-0.6875rem -0.25rem; }
.toggle         { width:2.375rem; height:1.375rem; border-radius:0.6875rem; position:relative; transition:background .15s; flex-shrink:0; }
.toggle-knob    { position:absolute; top:2px; width:1.125rem; height:1.125rem; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div id="loading">Loading forecast…</div>
<div id="error"></div>
<div id="wrap">
  <div id="tiles-wrap"><div id="tiles" class="tiles"></div></div>
  <div id="load-status" class="load-status"></div>
  <div id="btns">
    <button class="btn btn-primary" onclick="window.parent.postMessage({action:'scrollToCalculator'},'*')">Create your own forecast</button>
    <button class="btn btn-secondary" onclick="window.parent.postMessage({action:'scrollToMap'},'*')">View the map</button>
  </div>
  <div id="tactical-wrap" class="tactical-loading">
    <div class="tactical-row">
      <span class="tactical-label">Tactical voting &mdash; see the effect on the numbers above</span>
      <div class="toggle-tap" id="tactical-hit">
        <div class="toggle" id="toggle-track">
          <div class="toggle-knob" id="toggle-knob"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
// iframe1 is a DISPLAY ONLY layer.
// It receives seat counts (and a with/without-tactical pair for the local
// flick toggle) from iframe3 via the parent relay. It runs no model itself.

const LABELS  = {con:'Con',lab:'Lab',ldem:'LDem',grn:'Grn',snp:'SNP',pc:'PC',ref:'Ref',oth:'Ind'};
const COLOURS = {con:'#05718F',lab:'#D34C4C',ldem:'#EBB82F',grn:'#5CBC4A',snp:'#EEE03C',pc:'#469366',ref:'#15B6C2',oth:'#CCA7C6'};
const ALPHA   = {con:0,lab:0,ldem:0,grn:0,snp:0.48,pc:0,ref:0,oth:0};
const S24     = {con:121,lab:412,ldem:72,grn:4,snp:9,pc:4,ref:5,oth:5};

let lastCounts = null, lastWith = null, lastWithout = null, tacticalOn = true, dataLoaded = false;

// isSkeleton renders the card frames (colour, label) straight away, before
// the real per-seat model has finished in iframe3 — only the order (by 2024
// baseline) and the number/change values are placeholders, pulsing until
// the first real seatCounts message swaps them in.
function renderTiles(counts, isSkeleton) {
  const order = Object.keys(counts).sort((a,b) => (counts[b]||0)-(counts[a]||0));
  const el = document.getElementById('tiles');
  el.innerHTML = '';
  for (const p of order) {
    const colour = COLOURS[p]||'#999', a = ALPHA[p]!=null?ALPHA[p]:0.15;
    const t = document.createElement('div');
    t.className = 'tile' + (isSkeleton ? ' tile-skeleton' : '');
    t.style.background = colour;
    t.style.boxShadow = 'inset 0 0 0 999px rgba(0,0,0,'+a+')';
    if (isSkeleton) {
      t.innerHTML = `<div class="t-num">&ndash;</div>
        <div class="t-chg">&ndash;</div>
        <div class="t-rule"></div>
        <div class="t-label">${LABELS[p]||p}</div>`;
    } else {
      const n = counts[p]||0, prev = S24[p]||0, d = n-prev;
      t.innerHTML = `<div class="t-num">${n}</div>
        <div class="t-chg">${d>=0?'+':''}${d}</div>
        <div class="t-rule"></div>
        <div class="t-label">${LABELS[p]||p}</div>`;
    }
    el.appendChild(t);
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('wrap').style.display = 'block';
}

// Show the card frames immediately — sorted by 2024 baseline seat count,
// since the real order isn't known until the model finishes — rather than
// making the whole header wait on iframe3's map load.
renderTiles(S24, true);

function updateToggleUI() {
  document.getElementById('toggle-track').style.background = tacticalOn ? '#111' : '#ddd';
  document.getElementById('toggle-knob').style.left = tacticalOn ? '18px' : '2px';
}

function displayForCurrentToggle() {
  const counts = tacticalOn ? (lastWith || lastCounts) : (lastWithout || lastCounts);
  if (counts) renderTiles(counts, false);
}

document.getElementById('tactical-hit').addEventListener('click', () => {
  if (!dataLoaded) return; // nothing to flip between until the model's run once
  tacticalOn = !tacticalOn;
  updateToggleUI();
  displayForCurrentToggle();
});

// Receive seat counts from iframe3 via parent relay.
// withTactical / withoutTactical let this toggle flick instantly without a
// round trip; tacticalEnabled syncs the toggle to whatever the calculator
// last ran with, each time a fresh forecast arrives.
window.addEventListener('message', e => {
  if (e.data && e.data.action === 'seatCounts' && e.data.counts) {
    lastCounts = e.data.counts;
    lastWith = e.data.withTactical || null;
    lastWithout = e.data.withoutTactical || null;
    tacticalOn = (typeof e.data.tacticalEnabled === 'boolean') ? e.data.tacticalEnabled : true;
    if (!dataLoaded) {
      dataLoaded = true;
      document.getElementById('tactical-wrap').classList.remove('tactical-loading');
      document.getElementById('load-status').classList.remove('visible');
    }
    updateToggleUI();
    displayForCurrentToggle();
  }
});

// If the model's still crunching after 12s, say so under the cards — the
// cards themselves are already showing (see renderTiles(S24, true) above).
setTimeout(() => {
  if (!dataLoaded) {
    const status = document.getElementById('load-status');
    status.textContent = 'Still loading the live forecast — this can take a little while.';
    status.classList.add('visible');
  }
}, 12000);

// ── Auto-resize ──────────────────────────────────────────────────────────
// A fixed iframe height can't fit both the 2-col mobile grid and the 4-col
// desktop grid at once (different total heights) — so report actual content
// height to the parent page instead, which resizes the <iframe> to match.
// See README.md for the parent-page listener this depends on.
function reportHeight() {
  window.parent.postMessage({ action:'resize', frame:'forecast', height:document.documentElement.scrollHeight }, '*');
}
new ResizeObserver(reportHeight).observe(document.body);
window.addEventListener('load', reportHeight);
</script>
</body>
</html>
