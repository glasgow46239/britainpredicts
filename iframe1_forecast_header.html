<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Britain Predicts</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Arial',sans-serif; background:#fff; }

#loading { padding:24px; color:#999; font-size:13px; text-align:center; }
#error   { padding:24px; color:#c00; font-size:12px; }

#wrap { display:none; }

#header { padding:10px 16px 8px; border-bottom:2px solid #111; }
#brand  { font-size:14px; font-weight:700; color:#111; }
#sub    { font-size:10px; color:#999; margin-top:2px; }

#tiles {
  display:flex; flex-wrap:wrap; gap:6px;
  padding:12px 16px 8px;
}
.tile {
  flex:1; min-width:64px; max-width:120px;
  display:flex; flex-direction:column; align-items:center;
  padding:8px 6px 6px; border-radius:5px;
  cursor:default;
}
.t-party  { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.t-seats  { font-size:26px; font-weight:700; line-height:1; }
.t-change { font-size:10px; margin-top:3px; opacity:.85; }
.t-bar    { width:100%; height:3px; border-radius:2px; margin-top:6px; opacity:.45; }

#btns {
  display:flex; gap:8px; padding:8px 16px 12px;
}
.btn {
  flex:1; padding:9px 12px; border:none; border-radius:4px;
  font-size:12px; font-weight:700; cursor:pointer; letter-spacing:.02em;
}
.btn-dark { background:#111; color:#fff; }
.btn-dark:hover { background:#333; }
.btn-light { background:#f0ede8; color:#111; }
.btn-light:hover { background:#e5e0da; }

#status { font-size:9px; color:#ccc; text-align:right; padding:0 16px 6px; }
</style>
</head>
<body>

<div id="loading">Loading forecast…</div>
<div id="error" style="display:none"></div>

<div id="wrap">
  <div id="header">
    <div id="brand">Britain Predicts</div>
    <div id="sub">Loading…</div>
  </div>
  <div id="tiles"></div>
  <div id="btns">
    <button class="btn btn-dark"  onclick="window.parent.postMessage({action:'scrollToCalculator'},'*')">Create your own forecast</button>
    <button class="btn btn-light" onclick="window.parent.postMessage({action:'scrollToMap'},'*')">Map</button>
  </div>
  <div id="status"></div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const POLL_CSV    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=0&single=true&output=csv";
const RESULTS_URL = "https://raw.githubusercontent.com/glasgow46239/britainpredicts/main/results_2024.csv";
const PARAMS_CSV  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQW16UGOaAXAU_5uJMfFYEget3SV4u1qklugRW17lNCAIPUKoGLcqoJNGdXkQU6LqGluamK-EDq1eWQ/pub?gid=1932049493&single=true&output=csv";

const PARTIES    = ['con','lab','ldem','grn','snp','pc','ref','oth'];
const TILE_ORDER = ['lab','ref','con','ldem','grn','snp','pc','oth'];
const LABELS     = {con:'Con',lab:'Lab',ldem:'LDem',grn:'Grn',snp:'SNP',pc:'PC',ref:'Reform',oth:'Other'};
const COLOURS    = {con:'#0087DC',lab:'#E4003B',ldem:'#FAA61A',grn:'#02A95B',snp:'#C8A400',pc:'#3F8428',ref:'#12B6CF',oth:'#57534e'};
const SEATS_2024 = {con:121,lab:412,ldem:72,grn:4,snp:9,pc:4,ref:5,oth:5};
const GB_2024    = {con:23.7,lab:33.7,ldem:12.2,grn:6.4,snp:2.5,pc:0.7,ref:14.3,oth:6.2};

// ── Regional 2024 results — used as swing baseline ───────────────────────────
const BASELINE_2024 = {
  'GB-wide':         {con:23.7,lab:33.7,ldem:12.2,grn:6.4, snp:2.5, pc:0.7, ref:14.3,oth:6.2},
  'Scotland':        {con:12.7,lab:35.3,ldem:9.7, grn:3.8, snp:30.0,pc:0,   ref:7.0, oth:1.5},
  'Wales':           {con:18.2,lab:37.0,ldem:6.5, grn:4.7, snp:0,   pc:14.8,ref:16.9,oth:1.9},
  'Northern England':{con:19.6,lab:43.6,ldem:6.9, grn:7.2, snp:0,   pc:0,   ref:17.4,oth:5.3},
  'Southern England':{con:29.7,lab:26.5,ldem:19.4,grn:7.1, snp:0,   pc:0,   ref:15.1,oth:2.1},
  'Midlands':        {con:27.7,lab:35.2,ldem:7.3, grn:6.4, snp:0,   pc:0,   ref:18.6,oth:4.8},
  'London':          {con:20.6,lab:43.0,ldem:11.0,grn:10.0,snp:0,   pc:0,   ref:8.7, oth:6.7},
};

// ── CSV parser ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (!lines.length) return [];
  // Auto-detect separator
  const sep = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(sep).map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(sep).map(v => v.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = vals[i] !== undefined ? vals[i] : '');
    return obj;
  });
}

async function fetchCSV(url) {
  const sep = url.includes('?') ? '&' : '?';
  const r = await fetch(url + sep + '_=' + Date.now());
  if (!r.ok) throw new Error('Fetch failed: ' + url + ' (' + r.status + ')');
  return parseCSV(await r.text());
}

// ── Parse polling CSV into a region → party → % map ──────────────────────────
function buildPollMap(rows) {
  const map = {};
  for (const row of rows) {
    // Region name is in the 'region' column (or first column)
    const region = (row['region'] || row['Region'] || Object.values(row)[0] || '').trim();
    if (!region) continue;
    map[region] = {
      con:  parseFloat(row['con_pct']  || 0) || 0,
      lab:  parseFloat(row['lab_pct']  || 0) || 0,
      ldem: parseFloat(row['ldem_pct'] || 0) || 0,
      grn:  parseFloat(row['grn_pct']  || 0) || 0,
      snp:  parseFloat(row['snp_pct']  || 0) || 0,
      pc:   parseFloat(row['pc_pct']   || 0) || 0,
      ref:  parseFloat(row['ref_pct']  || 0) || 0,
      oth:  (parseFloat(row['oth_pct'] || 0) || 0) + (parseFloat(row['rstr_pct'] || 0) || 0),
    };
  }
  return map;
}

// ── Option C model ────────────────────────────────────────────────────────────
// pollMap: region → {con, lab, ...} — the POLL for each region
// For each seat, the swing is: poll[region][party] - baseline_2024[region][party]
// baseline_2024 is embedded in the results CSV (the 2024 local result IS the baseline)
// Actually: swing vs 2024 national average, applied from each region's current poll
// The cleanest version: use the regional poll % directly as the effective vote in that region
// Then apply the STM formula with regional poll as the "new national" and 2024 local as the base
function runModel(resultRows, pollMap, params) {
  const counts = {};
  PARTIES.forEach(p => counts[p] = 0);

  for (const seat of resultRows) {
    const code   = (seat['PCON24CD'] || '').trim();
    const region = (seat['Region']   || '').trim();
    if (!code || region === 'Northern Ireland') continue;

    // Get the regional poll — fall back to GB-wide if region not found
    const regPoll = pollMap[region] || pollMap['GB-wide'] || {};
    const p = params[code] || {};
    const shares = {};

    for (const party of PARTIES) {
      // 2024 local vote share
      const raw = parseFloat(seat[party + '_pct'] || 0);
      const local2024 = party === 'oth'
        ? (raw + parseFloat(seat['rstr_pct'] || 0) + parseFloat(seat['ind_pct'] || 0)) / 100
        : raw / 100;

      // Regional poll for this party (what the region is currently polling at)
      const regPollPct = (regPoll[party] || 0) / 100;

      // Regional 2024 result for this party — we need this as the baseline
      // Use GB_2024 scaled by region if not available
      // Actually: swing = regPoll - gb2024, applied on top of local2024
      // This is the standard uniform swing model, but using regional polls not national
      // Swing vs regional 2024 result — NOT GB 2024 average
      const regBase2024  = (BASELINE_2024[region] || BASELINE_2024['GB-wide'])[party] || 0;
      const swing        = regPollPct - regBase2024 / 100;
      const headroom = Math.max(0, 1 - local2024);
      const mult     = parseFloat(p[party + '_multiplier'] || 1) || 1;
      const frac     = parseFloat(p[party + '_fraction']   || 0.2) || 0.2;
      const floor    = local2024 * frac;

      shares[party] = Math.max(floor, Math.max(0, local2024 + swing * headroom * 2 * mult));
    }

    // Normalise to 100%
    const total = Object.values(shares).reduce((a, b) => a + b, 0);
    if (total > 0) PARTIES.forEach(p => shares[p] /= total);

    // Winner
    let winner = 'oth', best = 0;
    PARTIES.forEach(p => { if (shares[p] > best) { best = shares[p]; winner = p; } });
    counts[winner] = (counts[winner] || 0) + 1;
  }
  return counts;
}

// ── Render tiles ──────────────────────────────────────────────────────────────
function renderTiles(seats) {
  const el = document.getElementById('tiles');
  el.innerHTML = '';

  // Sort by seat count descending
  const ordered = [...TILE_ORDER].sort((a, b) => (seats[b] || 0) - (seats[a] || 0));

  for (const p of ordered) {
    const count = seats[p] || 0;
    const prev  = SEATS_2024[p] || 0;
    const diff  = count - prev;
    const tile  = document.createElement('div');
    tile.className = 'tile';
    tile.style.background = COLOURS[p] + '15';
    tile.innerHTML = `
      <div class="t-party"  style="color:${COLOURS[p]}">${LABELS[p]}</div>
      <div class="t-seats"  style="color:${COLOURS[p]}">${count}</div>
      <div class="t-change" style="color:${COLOURS[p]}">${diff >= 0 ? '+' : ''}${diff}</div>
      <div class="t-bar"    style="background:${COLOURS[p]}"></div>`;
    el.appendChild(tile);
  }
}

// ── Main ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const [pollRows, resultRows, paramRows] = await Promise.all([
      fetchCSV(POLL_CSV),
      fetchCSV(RESULTS_URL),
      fetchCSV(PARAMS_CSV),
    ]);

    const pollMap = buildPollMap(pollRows);
    const gbPoll  = pollMap['GB-wide'];
    if (!gbPoll) throw new Error('GB-wide row not found in polling CSV');

    const params = {};
    paramRows.forEach(r => { const c = (r['PCON24CD'] || '').trim(); if (c) params[c] = r; });

    const seats = runModel(resultRows, pollMap, params);

    // Show
    document.getElementById('loading').style.display = 'none';
    document.getElementById('wrap').style.display = 'block';

    renderTiles(seats);

    // Build subtitle from GB-wide poll
    const parts = ['ref','lab','con','ldem'].map(p =>
      `${LABELS[p]} ${(gbPoll[p] || 0).toFixed(1)}%`
    ).join(' · ');
    document.getElementById('sub').textContent = parts;
    document.getElementById('status').textContent =
      `Option C · ${resultRows.length} seats · ${Object.keys(params).length} with parameters · ${Object.keys(pollMap).length} regions`;

    // Tell the map what to show
    window.parent.postMessage({ action: 'forecastUpdate', pollMap }, '*');

  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Error: ' + e.message;
    console.error('iframe1:', e);
  }
}

init();
</script>
</body>
</html>
